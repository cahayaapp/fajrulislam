ight:900}.all-hadir{appearance:none;padding:9px 12px;border:0;border-radius:12px;background:#e8f9f2;color:#14825a;font-size:.65rem;font-weight:1000;cursor:pointer}.student-list{display:grid;gap:9px}.student-card{padding:13px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 8px 22px rgba(42,82,150,.055)}.student-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.student-no{width:32px;height:32px;display:grid;place-items:center;border-radius:11px;background:#eef5ff;color:var(--blue2);font-size:.66rem;font-weight:1000}.student-name{min-width:0;font-size:.78rem;font-weight:1000}.statuses{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.status{cursor:pointer}.status input{display:none}.status span{min-height:37px;display:grid;place-items:center;border:1px solid #e3eaf4;border-radius:11px;background:#fafcff;color:#687893;font-size:.62rem;font-weight:1000;transition:.16s}.status input:checked+span{color:#fff;border-color:var(--blue);background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 6px 14px rgba(40,120,255,.18)}.status:nth-child(2) input:checked+span{border-color:var(--orange);background:linear-gradient(135deg,#f6a349,#e98b2f)}.status:nth-child(3) input:checked+span,.status:nth-child(4) input:checked+span{border-color:var(--purple);background:linear-gradient(135deg,#8c7af1,#6d59dc)}.status:nth-child(5) input:checked+span{border-color:var(--red);background:linear-gradient(135deg,#f16b79,#dd495a)}.save{appearance:none;width:100%;min-height:50px;margin-top:13px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-size:.77rem;font-weight:1000;box-shadow:0 12px 25px rgba(40,120,255,.23);cursor:pointer}.save:disabled{opacity:.55;cursor:wait}.empty{padding:28px 15px;border:1px dashed #ccd9ea;border-radius:18px;background:rgba(255,255,255,.75);color:var(--muted);font-size:.72rem;font-weight:800;text-align:center}.toast{position:fixed;z-index:80;left:50%;bottom:24px;max-width:min(430px,calc(100vw - 24px));transform:translate(-50%,20px);padding:13px 16px;border-radius:15px;background:#173152;color:#fff;box-shadow:0 16px 38px rgba(23,49,82,.25);font-size:.72rem;font-weight:900;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.success{background:#13835b}.toast.error{background:#b73f4d}.loading{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(247,250,255,.88);backdrop-filter:blur(7px);color:var(--blue2);font-size:.76rem;font-weight:1000}.loading.show{display:grid}@keyframes sceneIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

<body>
<div class="loading" id="loading">Menyiapkan data…</div><div class="toast" id="toast"></div>
<main class="page">
  <section class="scene center active" id="sceneProgram"><div class="choice-grid" id="programGrid"><div class="empty">Memuat program…</div></div></section>
  <section class="scene center" id="sceneScope"><button class="back" type="button" onclick="showScene('sceneProgram')">‹</button><div class="choice-grid two" id="scopeGrid"></div></section>
  <section class="scene" id="sceneStudents"><button class="back" type="button" onclick="showScene('sceneScope')">‹</button><div class="student-toolbar"><span class="student-count" id="studentCount">0 santri</span><button class="all-hadir" type="button" onclick="markAllPresent()">Semua Hadir</button></div><div class="student-list" id="studentList"></div><button class="save" id="saveButton" type="button" onclick="saveAttendance()">Simpan</button></section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,get,push,set,update}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const app=initializeApp(window.CAHAYA_CONFIG.firebase),db=getDatabase(app),$=id=>document.getElementById(id);
const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,''),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const user=(()=>{try{return JSON.parse(localStorage.getItem('cahayaCurrentUser')||'{}')||{}}catch{return{}}})(),userName=String(user.label||user.nama||user.username||'Naqib').trim(),isPutri=['fatimah','meilisa','melisa','alamanda'].some(n=>norm(userName).includes(n));
let usrahData={},programs=[],selectedProgram=null,selectedUsrahKeys=[],students=[];
function todayJakarta(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}window.showScene=function(id){document.querySelectorAll('.scene').forEach(x=>x.classList.toggle('active',x.id===id))};
function toast(msg,type='success'){const t=$('toast');t.textContent=msg;t.className=`toast ${type} show`;clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),3000)}
function usrahNo(k){const m=String(k).match(/\d+/);return m?Number(m[0]):999}function allowedUsrah(k){const n=usrahNo(k);return isPutri?(n>=7&&n<=8):(n>=1&&n<=6)}function labelUsrah(k){return /^usrah\s/i.test(String(k))?String(k).replace(/^usrah\s*/i,'Usrah '):`Usrah ${String(k).match(/\d+/)?.[0]||k}`}
function names(v){const arr=Array.isArray(v)?v:(v&&typeof v==='object'?Object.values(v):[]);return arr.map(x=>typeof x==='string'?x:String(x?.nama||x?.namaSantri||x?.label||'')).map(x=>x.trim()).filter(Boolean)}
function programArray(raw){const out=[];const walk=(node,keyHint='')=>{if(!node)return;if(typeof node==='string'){if(node.trim())out.push({id:keyHint||norm(node),nama:node.trim()});return}if(Array.isArray(node)){node.forEach((v,i)=>walk(v,`${keyHint}-${i}`));return}if(typeof node!=='object')return;const scheduleLike=node.waktu||node.mulai||node.selesai||node.hariAktif||node.frekuensi||node.urutan!==undefined||node.pengawas;const nama=String(node.nama||node.program||node.namaProgram||node.label||node.judul||(scheduleLike?keyHint:'')||'').trim();if(nama&&scheduleLike)out.push({id:String(node.id||keyHint||norm(nama)),nama,mulai:node.mulai||node.jamMulai||String(node.waktu||'').split(/[–—-]/)[0]||'',selesai:node.selesai||node.jamSelesai||String(node.waktu||'').split(/[–—-]/)[1]||'',poin:Number(node.poin||node.point||node.points||0)||0,urutan:Number(node.urutan||node.no||999)});Object.entries(node).forEach(([k,v])=>{if(['nama','program','namaProgram','label','judul','waktu','mulai','selesai','jamMulai','jamSelesai','hariAktif','frekuensi','urutan','no','pengawas','id','poin','point','points'].includes(k))return;walk(v,k)})};walk(raw);return out}
function masterPrograms(raw){const out=[];Object.entries(raw||{}).forEach(([group,value])=>{if(value&&typeof value==='object'&&!Array.isArray(value)){Object.entries(value).forEach(([name,meta])=>out.push({id:norm(name),nama:name,poin:Number(meta?.poin||meta?.point||0)||0,urutan:999}))}else if(group)out.push({id:norm(group),nama:group,urutan:999})});return out}
function canonicalPrograms(){const daily=(window.CAHAYA_PROGRAM_HARIAN_24JAM||[]).map((p,i)=>({id:String(p.id||`daily-${i}`),nama:String(p.program||p.nama||'').trim(),mulai:String(p.waktu||'').split(/[–—-]/)[0]||'',selesai:String(p.waktu||'').split(/[–—-]/)[1]||'',urutan:Number(p.no||i+1),poin:Number(p.poin||0)||0}));const weekly=(window.CAHAYA_PROGRAM_PEKANAN_PENGASUHAN||[]).map((p,i)=>({id:String(p.id||`weekly-${i}`),nama:String(p.program||p.nama||'').trim(),mulai:String(p.waktu||'').split(/[–—-]/)[0]||'',selesai:String(p.waktu||'').split(/[–—-]/)[1]||'',urutan:Number(p.no||100+i),poin:Number(p.poin||0)||0}));return[...daily,...weekly].filter(p=>p.nama)}
function mergePrograms(scheduleRaw,masterRaw){const map=new Map();[...canonicalPrograms(),...programArray(scheduleRaw),...masterPrograms(masterRaw)].forEach(p=>{const k=norm(p.nama);if(!k)return;if(!map.has(k))map.set(k,p);else map.set(k,{...p,...map.get(k)})});return[...map.values()].sort((x,y)=>(Number(x.urutan)||999)-(Number(y.urutan)||999)||String(x.mulai||'99:99').localeCompare(String(y.mulai||'99:99'))||x.nama.localeCompare(y.nama,'id'))}
function fitProgramGrid(){const root=$('programGrid');if(!root)return;const w=Math.max(document.documentElement.clientWidth||0,window.innerWidth||0);const cols=w<=720?4:(w<=980?5:6);const rows=Math.max(1,Math.ceil(Math.max(programs.length,1)/cols));root.style.setProperty('--program-cols',String(cols));root.style.setProperty('--program-rows',String(rows))}
function renderPrograms(){const root=$('programGrid');root.innerHTML=programs.length?programs.map((p,i)=>`<button class="choice" type="button" onclick="pickProgram(${i})"><span class="choice-icon">${['◷','✦','☀','◫','⌁','✓'][i%6]}</span><b>${esc(p.nama)}</b>${p.mulai?`<span>${esc(p.mulai)}${p.selesai?'–'+esc(p.selesai):''}</span>`:''}</button>`).join(''):'<div class="empty">Belum ada program pada database.</div>';fitProgramGrid()}
window.pickProgram=function(i){selectedProgram=programs[i];selectedUsrahKeys=[];const keys=Object.keys(usrahData).filter(allowedUsrah).sort((a,b)=>usrahNo(a)-usrahNo(b));$('scopeGrid').innerHTML=`<button class="choice" type="button" onclick="pickScope('all')"><span class="choice-icon">◎</span><b>Semua Usrah ${isPutri?'Putri':'Putra'}</b><span>${keys.length} usrah</span></button>`+keys.map(k=>`<button class="choice" type="button" onclick="pickScope('${esc(k)}')"><span class="choice-icon">◉</span><b>${esc(labelUsrah(k))}</b><span>${names(usrahData[k]).length} santri</span></button>`).join('');showScene('sceneScope')}
window.pickScope=function(key){const keys=Object.keys(usrahData).filter(allowedUsrah).sort((a,b)=>usrahNo(a)-usrahNo(b));selectedUsrahKeys=key==='all'?keys:[key];const map=new Map();selectedUsrahKeys.forEach(u=>names(usrahData[u]).forEach(n=>map.set(norm(n),{nama:n,usrah:u,status:'H'})));students=[...map.values()].sort((a,b)=>a.nama.localeCompare(b.nama,'id'));renderStudents();showScene('sceneStudents')}
function renderStudents(){$('studentCount').textContent=`${students.length} santri`;$('studentList').innerHTML=students.length?students.map((s,i)=>`<article class="student-card"><div class="student-head"><span class="student-no">${i+1}</span><span class="student-name">${esc(s.nama)}</span></div><div class="statuses">${[['H','Hadir'],['T','Terlambat'],['I','Izin'],['S','Sakit'],['A','Alfa']].map(([v,l])=>`<label class="status"><input type="radio" name="st_${i}" value="${v}" ${s.status===v?'checked':''} onchange="setStatus(${i},'${v}')"><span>${l}</span></label>`).join('')}</div></article>`).join(''):'<div class="empty">Tidak ada santri pada pilihan ini.</div>'}
window.setStatus=(i,v)=>{if(students[i])students[i].status=v};window.markAllPresent=()=>{students.forEach(s=>s.status='H');renderStudents()};
function sickNames(raw){const set=new Set();const walk=v=>{if(!v)return;if(typeof v==='string'){set.add(norm(v));return}if(Array.isArray(v)){v.forEach(walk);return}if(typeof v==='object'){if(v.nama||v.namaSantri||v.santri){const active=String(v.status||v.keputusan||v.approval||'').toLowerCase();if(!active||active.includes('setuju')||active.includes('approved')||active.includes('aktif')||active.includes('sakit'))set.add(norm(v.nama||v.namaSantri||v.santri));}else Object.values(v).forEach(walk)}};walk(raw);return set}
window.saveAttendance=async function(){if(!selectedProgram||!students.length)return toast('Data absensi belum siap.','error');const btn=$('saveButton');btn.disabled=true;btn.textContent='Menyimpan…';const tanggal=todayJakarta();try{let sick=new Set();try{const snap=await get(ref(db,`cahaya_app/izin_sakit_harian/${tanggal}`));if(snap.exists())sick=sickNames(snap.val())}catch(e){console.warn('Data sakit tidak dapat dibaca',e)}const data=students.map(s=>{let status=s.status;if(status==='A'&&sick.has(norm(s.nama)))status='S';return{nama:s.nama,namaSantri:s.nama,status,usrahAsal:s.usrah}});const log={tanggal,program:selectedProgram.nama,programId:selectedProgram.id||norm(selectedProgram.nama),usrah:selectedUsrahKeys.length===1?selectedUsrahKeys[0]:'SEMUA',labelUsrah:selectedUsrahKeys.length===1?labelUsrah(selectedUsrahKeys[0]):`Semua Usrah ${isPutri?'Putri':'Putra'}`,jenisCakupan:selectedUsrahKeys.length===1?'usrah':'semua_usrah',cakupanUsrah:selectedUsrahKeys,naqibPenginput:userName,unit:isPutri?'Putri':'Putra',jumlahSantri:data.length,poinProgram:selectedProgram.poin||0,data,waktu:new Date().toISOString()};const saved=await push(ref(db,'cahaya_app/absensi_program_harian'),log);const updates={};if(saved.key)data.forEach(item=>{const k=norm(item.nama);if(k)updates[`cahaya_app/wali_index/${k}/program/${saved.key}`]={...log,data:[item]}});if(Object.keys(updates).length)await update(ref(db),updates);toast('Absensi program berhasil disimpan.');setTimeout(()=>{showScene('sceneProgram');selectedProgram=null;selectedUsrahKeys=[];students=[]},800)}catch(e){console.error(e);toast(e.message||'Absensi gagal disimpan.','error')}finally{btn.disabled=false;btn.textContent='Simpan'}};
window.addEventListener('resize',fitProgramGrid,{passive:true});
async function init(){$('loading').classList.add('show');try{const [u,m,j]=await Promise.all([get(ref(db,'cahaya_app/master_usrah')),get(ref(db,'cahaya_app/master_program_harian')),get(ref(db,'cahaya_app/jadwal_program_harian'))]);usrahData=u.val()||window.CAHAYA_MASTER_DATA?.usrah||{};programs=mergePrograms(j.val(),m.val());renderPrograms()}catch(e){console.error(e);usrahData=window.CAHAYA_MASTER_DATA?.usrah||{};programs=[];renderPrograms();toast('Data program belum dapat dimuat.','error')}finally{$('loading').classList.remove('show')}}init();
</script>
