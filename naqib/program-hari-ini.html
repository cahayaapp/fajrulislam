<script>
(function(){'use strict';const A=window.CahayaNaqibProgramToday,C=window.cahayaRoleContext;if(!C||!['NAQIB','NAQIBAH'].includes(C.activeRole))return;C.assertCurrent();const user=(()=>{try{return JSON.parse(localStorage.getItem('cahayaCurrentUser')||'{}')||{}}catch{return{}}})(),identities=[user.username,user.label,user.nama,user.namaTampilan,user.displayName,user.name].map(value=>String(value||'').trim()).filter(Boolean),name=identities,role=C.activeRole,unit=C.unit,now=A.jakartaParts(),operationalDate=new Date(Date.now()-210*60000),base=A.basePrograms(window.CAHAYA_PROGRAM_HARIAN_24JAM||[],window.CAHAYA_PROGRAM_PEKANAN_PENGASUHAN||[],operationalDate),state={programs:base,reports:null,assignmentReady:false,weekendMode:false,generation:0,timer:0,loader:null};const $=id=>document.getElementById(id);$('roleChip').textContent=role==='NAQIBAH'?'Naqibah':'Naqib';$('unitChip').textContent=unit==='PUTRI'?'Putri':'Putra';$('dateLabel').textContent=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());

<script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';import{getDatabase,ref,get,query,orderByChild,equalTo}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';const page=window.CahayaProgramTodayPage,ctx=window.cahayaRoleContext,A=window.CahayaNaqibProgramToday,K=window.CahayaWeeklyKpiV2,W=window.CahayaNaqibWeekendModeV2,app=getApps().length?getApps()[0]:initializeApp(window.CAHAYA_CONFIG.firebase),db=getDatabase(app);const records=snap=>snap.exists()?Object.values(snap.val()||{}):[],validSchedule=value=>Boolean(value&&(value.blok&&value.jadwal||value.putra?.blok&&value.putra?.jadwal));async function localFallback(){const response=await fetch('../data/jadwal-piket-pengawas-2026-2027.json',{cache:'no-store'});if(!response.ok)throw new Error('Fallback jadwal piket tidak tersedia');return A.normalizeDutySchedule(await response.json())}page.attachLoader(async current=>{const token=current.token(),date=A.jakartaParts().date,week=K.rewardWeekOf(new Date()),personKey=W.personKey(current.identities());ctx.assertCurrent();const scheduleTask=get(ref(db,'cahaya_app/jadwal_piket_naqib')).then(async snap=>validSchedule(snap.val())?snap.val():localFallback()).catch(localFallback),reportsTask=get(query(ref(db,'cahaya_app/jurnal_piket_naqib'),orderByChild('tanggal'),equalTo(date))),rewardTask=personKey?get(ref(db,`cahaya_app/kpi_mingguan_v2/naqib/${personKey}/${week.weekKey}/reward`)).then(snap=>snap.val()||null).catch(()=>null):Promise.resolve(null);try{const [schedule,reports,reward]=await Promise.all([scheduleTask,reportsTask,rewardTask]);if(!current.active(token))return;ctx.assertCurrent();current.applySchedule(schedule,reward);current.applyStatus(records(reports))}catch(error){if(!current.active(token))return;console.warn('Status Program Hari Ini belum tersedia',error);try{current.applySchedule(await localFallback(),null)}catch{current.applySchedule({},null)}current.failStatus()}});</script></body><
