  <style>
    :root{--blue:#2878ff;--blue2:#1557d5;--gold:#f2b632;--cyan:#13bfd8;--purple:#7968ed;--green:#22b982;--orange:#f39a3c;--red:#ee5b6b;--ink:#172643;--muted:#73819a;--line:#e3eaf4;--bg:#f5f8ff}
    *{box-sizing:border-box}html,body{margin:0;min-width:320px;min-height:100%;overflow-x:hidden}body{font-family:Nunito,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 0 0,rgba(19,191,216,.10),transparent 27%),radial-gradient(circle at 100% 0,rgba(121,104,237,.09),transparent 26%),linear-gradient(180deg,#f4f8ff,#fbfdff)}button{font:inherit}.page{width:min(1120px,100%);margin:auto;padding:16px 15px 34px}.scene{display:none;min-height:calc(100dvh - 32px);animation:sceneIn .32s cubic-bezier(.2,.8,.2,1) both}.scene.active{display:flex;flex-direction:column}.scene.center{justify-content:center}.scene-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.back{appearance:none;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:13px;background:#fff;color:#45617f;font-size:1.05rem;font-weight:1000;cursor:pointer}.period-wrap{width:min(720px,100%);margin:auto}.period-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.period{appearance:none;min-height:142px;padding:19px 15px;border:1px solid rgba(40,120,255,.14);border-radius:24px;background:#fff;box-shadow:0 15px 34px rgba(42,82,150,.08);text-align:left;cursor:pointer;transition:.2s}.period:hover{transform:translateY(-4px);box-shadow:0 20px 38px rgba(42,82,150,.13)}.period-icon{width:46px;height:46px;display:grid;place-items:center;margin-bottom:18px;border-radius:15px;font-size:1.3rem;background:#edf5ff}.period:nth-child(2) .period-icon{background:#f1efff}.period:nth-child(3) .period-icon{background:#fff5d8}.period b{display:block;font-size:.95rem;font-weight:1000}.period span{display:block;margin-top:5px;color:var(--muted);font-size:.68rem;font-weight:750;line-height:1.45}.dashboard{display:grid;gap:13px}.overview{display:grid;grid-template-columns:220px minmax(0,1fr);gap:13px}.donut-card,.metric-card,.usrah-card,.student-card{border:1px solid var(--line);background:#fff;box-shadow:0 10px 28px rgba(42,82,150,.07)}.donut-card{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:205px;border-radius:22px}.donut{--p:0;--accent:var(--blue);position:relative;width:126px;height:126px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),#eaf0f8 0)}.donut:after{content:"";position:absolute;inset:13px;border-radius:50%;background:#fff}.donut strong{position:relative;z-index:1;font-size:1.55rem;font-weight:1000}.donut-card span{margin-top:10px;color:var(--muted);font-size:.68rem;font-weight:850}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.metric-card{min-height:94px;padding:15px;border-radius:18px}.metric-card i{display:block;width:31px;height:31px;margin-bottom:9px;border-radius:10px;background:#edf5ff}.metric-card:nth-child(2) i{background:#fff5d8}.metric-card:nth-child(3) i{background:#fff0f3}.metric-card span{display:block;color:var(--muted);font-size:.61rem;font-weight:900;text-transform:uppercase;letter-spacing:.35px}.metric-card b{display:block;margin-top:4px;font-size:.95rem;font-weight:1000}.usrah-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.usrah-card{appearance:none;display:grid;grid-template-columns:minmax(0,1fr) 66px;gap:12px;align-items:center;padding:15px;border-radius:19px;text-align:left;cursor:pointer;transition:.18s}.usrah-card:hover{transform:translateY(-2px);border-color:#bfd3f5}.usrah-copy b{display:block;font-size:.86rem;font-weight:1000}.usrah-copy span{display:block;margin-top:4px;color:var(--muted);font-size:.62rem;font-weight:750}.mini-donut{--p:0;--accent:var(--blue);position:relative;width:60px;height:60px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),#edf1f7 0)}.mini-donut:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}.mini-donut b{position:relative;z-index:1;font-size:.73rem;font-weight:1000}.empty{padding:28px 16px;border:1px dashed #ced9e9;border-radius:18px;background:rgba(255,255,255,.68);color:var(--muted);font-size:.74rem;font-weight:800;text-align:center;line-height:1.55}.student-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.student-card{display:grid;grid-template-columns:minmax(0,1fr) 66px;gap:12px;align-items:center;padding:13px 14px;border-radius:17px}.student-card strong{display:block;font-size:.77rem;font-weight:1000}.student-card small{display:block;margin-top:4px;color:var(--muted);font-size:.59rem;font-weight:750}.score-pill{padding:8px;border-radius:12px;background:#eef5ff;text-align:center;font-size:.76rem;font-weight:1000}.score-pill.good{color:#15865d;background:#e9f9f2}.score-pill.mid{color:#a56814;background:#fff5df}.score-pill.low{color:#c64252;background:#fff0f2}.loading{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(247,250,255,.88);backdrop-filter:blur(7px);color:var(--blue2);font-size:.78rem;font-weight:1000}.loading.show{display:grid}@keyframes sceneIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
    @media(max-width:780px){.page{padding:10px 9px 24px}.scene{min-height:calc(100dvh - 20px)}.period-grid{gap:8px}.period{min-height:120px;padding:14px 11px;border-radius:18px}.period-icon{width:39px;height:39px;margin-bottom:13px}.period b{font-size:.79rem}.period span{font-size:.58rem}.overview{grid-template-columns:1fr}.donut-card{min-height:174px}.metrics{grid-template-columns:repeat(3,1fr)}.metric-card{min-height:84px;padding:12px}.metric-card b{font-size:.78rem}.usrah-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.usrah-card{padding:12px 11px;grid-template-columns:minmax(0,1fr) 54px}.mini-donut{width:51px;height:51px}.student-grid{grid-template-columns:1fr}}
    @media(max-width:430px){.period-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.period{min-height:112px;padding:12px 9px}.period-icon{width:36px;height:36px;margin-bottom:11px}.period span{display:none}.metrics{gap:7px}.metric-card{padding:10px}.metric-card span{font-size:.52rem}.metric-card b{font-size:.7rem}.usrah-card{grid-template-columns:minmax(0,1fr) 48px}.mini-donut{width:46px;height:46px}.mini-donut:after{inset:6px}.mini-donut b{font-size:.62rem}}
  

/* V59 — pilihan periode lebih fresh, modern, dan profesional */
.period-wrap{width:min(760px,100%)}
.period-grid{gap:14px}
.period{position:relative;overflow:hidden;border-color:rgba(40,120,255,.12);background:linear-gradient(145deg,#fff,#f4f9ff);box-shadow:0 16px 36px rgba(42,82,150,.09)}
.period::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#2878ff,#16bfd8)}
.period:nth-child(2){background:linear-gradient(145deg,#fff,#f3efff);border-color:rgba(121,104,237,.18)}
.period:nth-child(2)::after{background:linear-gradient(90deg,#7968ed,#aa9cff)}
.period:nth-child(3){background:linear-gradient(145deg,#fff,#fff5d2);border-color:rgba(242,182,50,.25)}
.period:nth-child(3)::after{background:linear-gradient(90deg,#f0a20f,#f2b632)}
.period-icon{box-shadow:inset 0 0 0 1px rgba(40,120,255,.08),0 8px 18px rgba(40,120,255,.08)}
.period:nth-child(2) .period-icon{box-shadow:inset 0 0 0 1px rgba(121,104,237,.10),0 8px 18px rgba(121,104,237,.08)}
.period:nth-child(3) .period-icon{box-shadow:inset 0 0 0 1px rgba(242,182,50,.16),0 8px 18px rgba(242,182,50,.10)}
.period b{color:#15345f;letter-spacing:-.015em}
@media(max-width:430px){.period{border-radius:17px!important}.period-icon{border-radius:11px!important}}
  </style>
</head>
<body>
<div class="loading" id="loading">Memuat data kedisiplinan…</div>
<main class="page">
  <section class="scene center active" id="scenePeriod">
    <div class="period-wrap">
      <div class="period-grid">
        <button class="period" type="button" onclick="choosePeriod('today')"><span class="period-icon">☀️</span><b>Hari Ini</b><span>Kedisiplinan program hari ini</span></button>
        <button class="period" type="button" onclick="choosePeriod('week')"><span class="period-icon">📆</span><b>Pekan Ini</b><span>Senin sampai hari ini</span></button>
        <button class="period" type="button" onclick="choosePeriod('month')"><span class="period-icon">◫</span><b>Bulan Ini</b><span>Akumulasi bulan berjalan</span></button>
      </div>
    </div>
  </section>

  <section class="scene" id="sceneDashboard">
    <div class="scene-top"><button class="back" type="button" onclick="showScene('scenePeriod')">‹</button></div>
    <div class="dashboard">
      <div class="overview">
        <article class="donut-card"><div class="donut" id="overallDonut"><strong id="overallScore">—</strong></div><span id="periodLabel">—</span></article>
        <div class="metrics">
          <article class="metric-card"><i></i><span>Usrah Terbaik</span><b id="bestUsrah">—</b></article>
          <article class="metric-card"><i></i><span>Perlu Perhatian</span><b id="lowUsrah">—</b></article>
          <article class="metric-card"><i></i><span>Data Dinilai</span><b id="recordCount">0</b></article>
        </div>
      </div>
      <div class="usrah-grid" id="usrahGrid"></div>
    </div>
  </section>

  <section class="scene" id="sceneStudents">
    <div class="scene-top"><button class="back" type="button" onclick="showScene('sceneDashboard')">‹</button></div>
    <div class="student-grid" id="studentGrid"></div>
  </section>
</main>
<script>
(function(){
  const CFG=window.CAHAYA_CONFIG?.firebase||{};
  if(!firebase.apps.length) firebase.initializeApp(CFG);
  const db=firebase.database();
  const PATH_USRAH='cahaya_app/master_usrah',PATH_ATT='cahaya_app/absensi_program_harian';
  const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const currentUser=(()=>{try{return JSON.parse(localStorage.getItem('cahayaCurrentUser')||'{}')||{}}catch{return{}}})();
  const userName=String(currentUser.label||currentUser.nama||currentUser.username||'').trim();
  const putriNames=['fatimah','meilisa','melisa','alamanda'];
  const isPutri=putriNames.some(n=>norm(userName).includes(n));
  let usrahData={},attendance=[],period={key:'',start:'',end:'',label:''},results=[];

  function todayJakarta(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
  function addDays(iso,days){const d=new Date(`${iso}T12:00:00`);d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
  function mondayOf(iso){const d=new Date(`${iso}T12:00:00`),day=d.getDay()||7;return addDays(iso,1-day)}
  function choosePeriod(key){const today=todayJakarta();if(key==='today')period={key,start:today,end:today,label:'Hari Ini'};if(key==='week')period={key,start:mondayOf(today),end:today,label:'Pekan Ini'};if(key==='month')period={key,start:today.slice(0,7)+'-01',end:today,label:'Bulan Ini'};loadData()}
  window.choosePeriod=choosePeriod;
  window.showScene=function(id){document.querySelectorAll('.scene').forEach(x=>x.classList.toggle('active',x.id===id))};
  function usrahNo(k){const m=String(k).match(/\d+/);return m?Number(m[0]):999}
  function allowedUsrah(k){const n=usrahNo(k);return isPutri?(n>=7&&n<=8):(n>=1&&n<=6)}
  function labelUsrah(k){return /^usrah\s/i.test(String(k))?String(k).replace(/^usrah\s*/i,'Usrah '):`Usrah ${String(k).match(/\d+/)?.[0]||k}`}
  function names(v){const arr=Array.isArray(v)?v:(v&&typeof v==='object'?Object.values(v):[]);return arr.map(x=>typeof x==='string'?x:String(x?.nama||x?.namaSantri||x?.label||'')).map(x=>x.trim()).filter(Boolean)}
  function statusScore(v){const s=String(v||'').trim().toUpperCase();if(['H','HADIR'].includes(s))return 100;if(['T','TERLAMBAT','TELAT'].includes(s))return 70;if(['A','ALFA','ALPHA'].includes(s))return 0;if(['I','IZIN','S','SAKIT'].includes(s))return null;return null}
  function normalizeAttendance(raw){const rows=[];Object.values(raw||{}).forEach(log=>{if(!log||typeof log!=='object')return;const date=String(log.tanggal||log.date||'').slice(0,10);const logUsrah=String(log.usrah||log.labelUsrah||'');const data=Array.isArray(log.data)?log.data:Object.values(log.data||log.daftarSantri||{});data.forEach(it=>{if(!it)return;const name=typeof it==='string'?it:String(it.nama||it.namaSantri||it.santri||'');if(name)rows.push({date,name,status:it.status||it.kehadiran||'',usrah:String(it.usrahAsal||it.usrah||logUsrah)})})});return rows}
  function inPeriod(d){return d&&d>=period.start&&d<=period.end}
  function accent(score,index=0){if(score==null)return '#aeb8c8';if(score>=90)return '#22b982';if(score>=75)return ['#2878ff','#7968ed','#13bfd8'][index%3];if(score>=60)return '#f39a3c';return '#ee5b6b'}
  function compute(){
    const filteredUsrah=Object.fromEntries(Object.entries(usrahData||{}).filter(([k])=>allowedUsrah(k)));
    const nameMap=new Map();Object.entries(filteredUsrah).forEach(([u,v])=>names(v).forEach(n=>nameMap.set(norm(n),u)));
    const buckets={};Object.entries(filteredUsrah).forEach(([u,v])=>buckets[u]={key:u,label:labelUsrah(u),members:names(v),events:[]});
    attendance.filter(x=>inPeriod(x.date)).forEach(e=>{let u=(e.usrah&&buckets[e.usrah])?e.usrah:nameMap.get(norm(e.name));if(!u){const n=usrahNo(e.usrah);u=Object.keys(buckets).find(k=>usrahNo(k)===n)}if(u&&buckets[u])buckets[u].events.push(e)});
    results=Object.values(buckets).map(b=>{const sm=new Map(b.members.map(n=>[norm(n),{name:n,scores:[],h:0,t:0,a:0,x:0}]));b.events.forEach(e=>{const k=norm(e.name);if(!sm.has(k))sm.set(k,{name:e.name,scores:[],h:0,t:0,a:0,x:0});const s=sm.get(k),score=statusScore(e.status);if(score===100)s.h++;else if(score===70)s.t++;else if(score===0)s.a++;else s.x++;if(score!==null)s.scores.push(score)});const students=[...sm.values()].map(s=>({...s,count:s.scores.length,score:s.scores.length?Math.round(s.scores.reduce((a,b)=>a+b,0)/s.scores.length):null})).sort((a,b)=>(b.score??-1)-(a.score??-1)||a.name.localeCompare(b.name,'id'));const scores=b.events.map(e=>statusScore(e.status)).filter(v=>v!==null);return{...b,students,count:scores.length,score:scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):null}}).sort((a,b)=>(b.score??-1)-(a.score??-1)||usrahNo(a.key)-usrahNo(b.key));renderDashboard()}
  function renderDashboard(){const scored=results.filter(r=>r.score!=null),avg=scored.length?Math.round(scored.reduce((a,b)=>a+b.score,0)/scored.length):null;const best=scored[0],low=scored[scored.length-1];$('overallScore').textContent=avg==null?'—':avg+'%';$('overallDonut').style.setProperty('--p',avg||0);$('overallDonut').style.setProperty('--accent',accent(avg));$('periodLabel').textContent=period.label;$('bestUsrah').textContent=best?.label||'—';$('lowUsrah').textContent=low?.label||'—';$('recordCount').textContent=scored.reduce((s,r)=>s+r.count,0);$('usrahGrid').innerHTML=results.length?results.map((r,i)=>`<button class="usrah-card" type="button" onclick="openUsrah('${esc(r.key)}')"><span class="usrah-copy"><b>${esc(r.label)}</b><span>${r.members.length} santri</span></span><span class="mini-donut" style="--p:${r.score||0};--accent:${accent(r.score,i)}"><b>${r.score==null?'—':r.score+'%'}</b></span></button>`).join(''):'<div class="empty">Belum ada master usrah untuk unit ini.</div>';showScene('sceneDashboard')}
  window.openUsrah=function(key){const r=results.find(x=>x.key===key);if(!r)return;$('studentGrid').innerHTML=r.students.length?r.students.map(s=>`<article class="student-card"><div><strong>${esc(s.name)}</strong><small>${s.count?`${s.h} hadir • ${s.t} terlambat • ${s.a} alfa`:'Belum ada data pada periode ini'}</small></div><div class="score-pill ${s.score==null?'':s.score>=85?'good':s.score>=70?'mid':'low'}">${s.score==null?'—':s.score+'%'}</div></article>`).join(''):'<div class="empty">Belum ada anggota usrah.</div>';showScene('sceneStudents')};
  async function read(path){if(window.CahayaBandwidth)return window.CahayaBandwidth.readCompat(db,path,{ttl:180000,limit:1800});return db.ref(path).limitToLast(1800).once('value')}
  async function loadData(){$('loading').classList.add('show');try{const [u,a]=await Promise.all([read(PATH_USRAH),read(PATH_ATT)]);usrahData=u.val()||window.CAHAYA_MASTER_DATA?.usrah||{};attendance=normalizeAttendance(a.val());compute()}catch(e){console.error(e);usrahData=window.CAHAYA_MASTER_DATA?.usrah||{};attendance=[];compute()}finally{$('loading').classList.remove('show')}}
})();
</script>
<script src="../js/cahaya-responsive-v24.js?v=37" defer></script>
</body>
</html>
