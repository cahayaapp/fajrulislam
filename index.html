<!DOCTYPE html>
<html lang="id">
<head>
  <script src="config/tenant-config.js"></script>
  <script src="config/master-data.js"></script>
  <script src="js/cahaya-config-runtime.js" defer></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#075EEA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="cahaya-build" content="20260819-v47">

  <title>CAHAYA APP — Pesantren Cahaya Fajrul Islam</title>
  <link rel="icon" type="image/png" href="assets/logofi.png">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900;1000&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --blue-950:#082d7f;
      --blue-900:#0647bf;
      --blue-800:#075eea;
      --blue-700:#1479f4;
      --blue-100:#eaf3ff;
      --blue-50:#f5f9ff;
      --gold-500:#f2b705;
      --gold-400:#ffc928;
      --gold-100:#fff4c8;
      --ink:#121a2b;
      --text:#35415a;
      --muted:#7b879d;
      --line:#e4eaf2;
      --white:#fff;
      --danger:#d92d20;
      --shadow:0 28px 70px rgba(17,55,115,.15);
      --soft-shadow:0 14px 36px rgba(21,56,112,.08);
      --radius-xl:32px;
      --radius-lg:22px;
      --radius-md:16px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;width:100%}
    body{
      font-family:"Nunito","Plus Jakarta Sans",system-ui,sans-serif;
      color:var(--ink);
      background:#f4f7fb;
      overflow-x:hidden;
      -webkit-tap-highlight-color:transparent;
    }
    button,input{font:inherit}
    button{cursor:pointer}

    .page{
      min-height:100dvh;
      display:grid;
      grid-template-columns:minmax(0,1.03fr) minmax(440px,.97fr);
      background:#f4f7fb;
    }

    .visual{
      min-height:100dvh;
      position:relative;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:clamp(28px,4vw,58px);
      color:#fff;
      background:
        radial-gradient(circle at 84% 12%, rgba(255,255,255,.17), transparent 20%),
        radial-gradient(circle at 18% 92%, rgba(255,201,40,.18), transparent 24%),
        linear-gradient(148deg,#063aab 0%,#075eea 51%,#1590f5 100%);
    }

    .visual::before{
      content:"";
      position:absolute;
      width:380px;height:380px;
      right:-150px;top:-120px;
      border:52px solid rgba(255,255,255,.07);
      border-radius:50%;
    }
    .visual::after{
      content:"";
      position:absolute;
      width:420px;height:420px;
      left:-240px;bottom:-250px;
      border:72px solid rgba(255,201,40,.12);
      border-radius:50%;
    }

    .brand{
      position:relative;z-index:2;
      display:flex;align-items:center;gap:16px;
    }
    .brand-mark{
      width:66px;height:66px;flex:0 0 66px;
      display:grid;place-items:center;
      padding:7px;
      border-radius:20px;
      background:#fff;
      box-shadow:0 18px 38px rgba(2,31,96,.22);
    }
    .brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
    .brand-copy strong{display:block;font-size:1.42rem;font-weight:1000;letter-spacing:-.03em}
    .brand-copy span{display:block;margin-top:3px;font-size:.72rem;font-weight:800;letter-spacing:.07em;color:rgba(255,255,255,.78);text-transform:uppercase}

    .visual-main{position:relative;z-index:2;max-width:650px;padding:58px 0 46px}
    .eyebrow{
      display:inline-flex;align-items:center;gap:9px;
      padding:8px 12px;
      border:1px solid rgba(255,255,255,.25);
      border-radius:999px;
      color:#fff;
      font-size:.75rem;font-weight:900;letter-spacing:.04em;
      background:rgba(255,255,255,.09);
      backdrop-filter:blur(10px);
    }
    .eyebrow-dot{width:7px;height:7px;border-radius:50%;background:var(--gold-400);box-shadow:0 0 16px rgba(255,201,40,.9)}
    .visual h1{
      margin-top:20px;
      max-width:560px;
      font-size:clamp(2.65rem,5.5vw,5.3rem);
      line-height:.98;
      letter-spacing:-.055em;
      font-weight:1000;
      text-wrap:balance;
    }
    .visual h1 .gold{color:var(--gold-400)}
    .visual-desc{
      max-width:520px;
      margin-top:20px;
      color:rgba(255,255,255,.82);
      font-size:clamp(.96rem,1.4vw,1.12rem);
      font-weight:700;
      line-height:1.65;
    }

    .feature-row{
      position:relative;z-index:2;
      display:flex;flex-wrap:wrap;gap:10px;
    }
    .feature{
      display:flex;align-items:center;gap:8px;
      padding:9px 12px;
      border-radius:14px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.16);
      color:rgba(255,255,255,.9);
      font-size:.74rem;font-weight:800;
      backdrop-filter:blur(8px);
    }
    .feature svg{width:17px;height:17px;color:var(--gold-400)}

    .auth-side{
      min-height:100dvh;
      display:grid;place-items:center;
      padding:clamp(24px,4vw,64px);
      position:relative;
      background:
        radial-gradient(circle at 100% 0%, rgba(7,94,234,.07), transparent 26%),
        linear-gradient(180deg,#fbfdff 0%,#f3f6fb 100%);
    }

    .auth-wrap{width:min(100%,470px);position:relative;z-index:2}
    .mobile-brand{display:none}

    .auth-card{
      width:100%;
      padding:clamp(26px,4vw,42px);
      background:rgba(255,255,255,.96);
      border:1px solid rgba(226,233,243,.95);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow);
    }

    .auth-kicker{
      display:flex;align-items:center;gap:8px;
      color:var(--blue-800);
      font-size:.75rem;font-weight:1000;letter-spacing:.07em;text-transform:uppercase;
    }
    .auth-kicker::before{content:"";width:24px;height:4px;border-radius:999px;background:var(--gold-400)}
    .auth-title{
      margin-top:12px;
      font-size:clamp(2rem,4vw,2.75rem);
      line-height:1.05;
      letter-spacing:-.04em;
      font-weight:1000;
      color:var(--ink);
    }
    .auth-desc{
      margin-top:10px;
      color:var(--muted);
      font-size:.92rem;font-weight:700;line-height:1.55;
    }

    .login-form{margin-top:28px;display:grid;gap:18px}
    .form-group{display:grid;gap:8px}
    label{font-size:.78rem;font-weight:900;color:#283248}
    .input-shell{position:relative}
    .input-icon{
      width:20px;height:20px;
      position:absolute;left:16px;top:50%;transform:translateY(-50%);
      color:#8492a9;pointer-events:none;
    }
    .form-control{
      width:100%;height:54px;
      padding:0 48px 0 48px;
      border:1.5px solid #dfe6ef;
      border-radius:16px;
      outline:none;
      color:var(--ink);
      background:#fff;
      font-size:.92rem;font-weight:700;
      transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
    }
    .form-control::placeholder{color:#a0a9b9;font-weight:600}
    .form-control:focus{border-color:var(--blue-700);box-shadow:0 0 0 4px rgba(20,121,244,.10)}
    .toggle-password{
      width:44px;height:44px;
      position:absolute;right:5px;top:50%;transform:translateY(-50%);
      display:grid;place-items:center;
      border:0;background:transparent;color:#75839b;border-radius:12px;
    }
    .toggle-password:hover{background:var(--blue-50);color:var(--blue-800)}

    #errorMsg{
      display:none;
      padding:11px 13px;
      border-radius:13px;
      border:1px solid #ffd4cf;
      background:#fff2f0;
      color:var(--danger);
      font-size:.78rem;font-weight:800;line-height:1.45;
    }

    .submit-btn{
      width:100%;min-height:56px;
      display:flex;align-items:center;justify-content:center;gap:10px;
      border:0;border-radius:16px;
      color:#fff;
      background:linear-gradient(135deg,#064ac8 0%,#075eea 58%,#1688f2 100%);
      box-shadow:0 16px 30px rgba(7,94,234,.24);
      font-size:.94rem;font-weight:1000;
      transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
      position:relative;overflow:hidden;
    }
    .submit-btn::after{
      content:"";position:absolute;inset:-60% auto -60% -30%;width:24%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.30),transparent);
      transform:skewX(-24deg);
      animation:shine 4.2s ease-in-out infinite;
    }
    .submit-btn:hover{transform:translateY(-1px);box-shadow:0 20px 36px rgba(7,94,234,.29)}
    .submit-btn:active{transform:scale(.992)}
    .submit-btn:disabled{opacity:.72;cursor:wait}
    .submit-btn svg{width:20px;height:20px}

    .auth-foot{
      margin-top:18px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    }
    .secure-note{display:flex;align-items:center;gap:8px;color:#79859a;font-size:.73rem;font-weight:800}
    .secure-note svg{width:17px;height:17px;color:var(--gold-500)}
    .install-btn{
      display:none;align-items:center;gap:7px;
      padding:8px 10px;border:0;background:transparent;color:var(--blue-800);
      font-size:.73rem;font-weight:900;border-radius:10px;
    }
    .install-btn:hover{background:var(--blue-50)}

    .copyright{margin-top:18px;text-align:center;color:#9aa4b4;font-size:.68rem;font-weight:700}

    #splashScreen{
      position:fixed;inset:0;z-index:9999;
      display:grid;place-items:center;
      background:rgba(246,249,253,.94);
      backdrop-filter:blur(10px);
      transition:opacity .55s ease,visibility .55s ease;
    }
    .splash-card{display:grid;justify-items:center;gap:14px;padding:24px 28px}
    .loader{
      width:48px;height:48px;border-radius:50%;
      border:4px solid #dfe9f7;border-top-color:var(--blue-800);border-right-color:var(--gold-400);
      animation:spin .85s linear infinite;
    }
    #loadingText{color:#47546b;font-size:.82rem;font-weight:900}

    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes shine{0%,66%{left:-40%}100%{left:120%}}

    @media (max-width:980px){
      .page{grid-template-columns:1fr}
      .visual{
        min-height:auto;
        padding:calc(22px + env(safe-area-inset-top)) 22px 78px;
        border-radius:0 0 34px 34px;
      }
      .visual .brand{display:none}
      .visual-main{padding:18px 0 18px;max-width:680px}
      .visual h1{font-size:clamp(2.25rem,8.8vw,4.2rem);max-width:650px}
      .visual-desc{max-width:620px}
      .feature-row{display:none}
      .auth-side{min-height:auto;margin-top:-48px;padding:0 16px calc(24px + env(safe-area-inset-bottom));background:transparent;place-items:start center}
      .auth-wrap{width:min(100%,560px)}
      .mobile-brand{
        display:flex;align-items:center;gap:11px;
        width:max-content;margin:0 auto 14px;
        padding:8px 12px;
        border-radius:16px;
        background:#fff;
        box-shadow:0 12px 28px rgba(13,50,111,.11);
      }
      .mobile-brand img{width:34px;height:34px;object-fit:contain}
      .mobile-brand strong{font-size:.88rem;font-weight:1000;color:var(--blue-900)}
      .auth-card{border-radius:28px;padding:28px 22px 24px}
    }

    @media (max-width:560px){
      body{background:#f4f7fb}
      .visual{padding-left:18px;padding-right:18px;padding-bottom:70px}
      .eyebrow{font-size:.68rem;padding:7px 10px}
      .visual h1{margin-top:16px;font-size:clamp(2.05rem,11vw,3rem);line-height:1.01}
      .visual-desc{margin-top:14px;font-size:.84rem;line-height:1.55}
      .auth-side{margin-top:-42px;padding-left:12px;padding-right:12px}
      .mobile-brand{margin-bottom:10px}
      .auth-card{padding:25px 18px 22px;border-radius:25px;box-shadow:0 20px 48px rgba(17,55,115,.13)}
      .auth-title{font-size:2rem}
      .auth-desc{font-size:.84rem}
      .login-form{margin-top:23px;gap:16px}
      .form-control{height:52px;font-size:.88rem}
      .submit-btn{min-height:54px}
      .auth-foot{justify-content:center}
      .secure-note{width:100%;justify-content:center;text-align:center}
    }

    @media (prefers-reduced-motion:reduce){
      *{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }


    /* =========================================================
       V39 — FIXED VIEWPORT LOGIN
       Satu layar, tanpa scroll; logo tetap di bagian atas mobile.
       ========================================================= */
    html,body{height:100%;min-height:0;overflow:hidden!important}
    body{overscroll-behavior:none}
    .page{height:100dvh;min-height:0;overflow:hidden}
    .visual,.auth-side{height:100dvh;min-height:0;overflow:hidden}
    .visual{justify-content:flex-start}
    .visual-main{margin:auto 0;padding:28px 0}
    .visual h1{margin-top:0}
    .auth-side{align-items:center}
    .auth-card{max-height:calc(100dvh - 48px);overflow:hidden}
    .mobile-brand{display:none!important}

    @media (max-width:980px){
      .page{
        height:100dvh;
        min-height:0;
        overflow:hidden;
        display:grid;
        grid-template-columns:1fr;
        grid-template-rows:34% 66%;
      }
      .visual{
        height:100%;
        min-height:0;
        padding:calc(14px + env(safe-area-inset-top)) 18px 48px;
        border-radius:0 0 30px 30px;
        justify-content:flex-start;
      }
      .visual .brand{
        display:flex!important;
        flex:0 0 auto;
        gap:11px;
      }
      .brand-mark{
        width:48px;height:48px;flex-basis:48px;
        padding:5px;border-radius:15px;
        box-shadow:0 10px 24px rgba(2,31,96,.18);
      }
      .brand-copy strong{font-size:1rem}
      .brand-copy span{font-size:.55rem;letter-spacing:.045em;margin-top:1px}
      .visual-main{
        margin:auto 0 0;
        padding:12px 0 0;
        max-width:none;
      }
      .visual h1{
        margin:0;
        max-width:520px;
        font-size:clamp(2rem,8.9vw,3.65rem);
        line-height:1.02;
        letter-spacing:-.05em;
      }
      .eyebrow,.visual-desc,.feature-row{display:none!important}
      .auth-side{
        height:100%;
        min-height:0;
        margin:0;
        padding:0 14px calc(10px + env(safe-area-inset-bottom));
        place-items:start center;
        background:transparent;
        overflow:visible;
      }
      .auth-wrap{
        width:min(100%,560px);
        transform:translateY(-32px);
      }
      .auth-card{
        max-height:none;
        padding:22px 20px 19px;
        border-radius:25px;
        box-shadow:0 18px 46px rgba(17,55,115,.14);
      }
      .auth-kicker{font-size:.67rem}
      .auth-title{margin-top:9px;font-size:clamp(1.75rem,6.8vw,2.25rem)}
      .login-form{margin-top:18px;gap:13px}
      .form-group{gap:6px}
      label{font-size:.73rem}
      .form-control{height:49px;font-size:.86rem;border-radius:14px}
      .submit-btn{min-height:50px;border-radius:14px;font-size:.9rem}
      .auth-foot{margin-top:12px}
      .copyright{margin-top:10px;font-size:.61rem}
    }

    @media (max-width:560px){
      .page{grid-template-rows:32% 68%}
      .visual{padding-left:16px;padding-right:16px;padding-bottom:44px}
      .brand-mark{width:44px;height:44px;flex-basis:44px;border-radius:14px}
      .brand-copy strong{font-size:.94rem}
      .brand-copy span{font-size:.5rem}
      .visual h1{font-size:clamp(1.78rem,9.4vw,2.7rem)}
      .auth-side{padding-left:10px;padding-right:10px}
      .auth-wrap{transform:translateY(-28px)}
      .auth-card{padding:19px 16px 16px;border-radius:22px}
      .auth-title{font-size:1.72rem}
      .login-form{margin-top:15px;gap:11px}
      .form-control{height:47px;padding-left:44px}
      .submit-btn{min-height:48px}
      .auth-foot{margin-top:10px}
    }

    @media (max-height:700px){
      .page{grid-template-rows:29% 71%}
      .visual{padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:36px}
      .brand-mark{width:40px;height:40px;flex-basis:40px}
      .brand-copy strong{font-size:.88rem}.brand-copy span{font-size:.46rem}
      .visual h1{font-size:clamp(1.55rem,7.7vw,2.3rem)}
      .auth-wrap{transform:translateY(-24px)}
      .auth-card{padding:16px 15px 14px}
      .auth-kicker{font-size:.61rem}.auth-title{font-size:1.48rem;margin-top:6px}
      .login-form{margin-top:11px;gap:9px}
      .form-group{gap:4px} label{font-size:.68rem}
      .form-control{height:43px;font-size:.8rem}
      .toggle-password{width:39px;height:39px}
      .submit-btn{min-height:44px;font-size:.84rem}
      .auth-foot{margin-top:7px}.secure-note{font-size:.64rem}.copyright{margin-top:6px;font-size:.56rem}
    }

    @media (min-width:981px) and (max-height:720px){
      .visual{padding:26px 38px}
      .brand-mark{width:54px;height:54px;flex-basis:54px}
      .brand-copy strong{font-size:1.15rem}
      .visual-main{padding:18px 0}
      .visual h1{font-size:clamp(2.4rem,4.5vw,4.25rem)}
      .feature-row{gap:7px}.feature{padding:7px 10px;font-size:.68rem}
      .auth-side{padding:20px 34px}
      .auth-card{padding:26px 30px}
      .auth-title{font-size:2rem}
      .login-form{margin-top:19px;gap:13px}
      .form-control{height:49px}.submit-btn{min-height:50px}
      .auth-foot{margin-top:12px}.copyright{margin-top:10px}
    }

  </style>
</head>
<body>
  <div id="splashScreen" aria-live="polite">
    <div class="splash-card">
      <div class="loader"></div>
      <div id="loadingText">Menyiapkan CAHAYA APP...</div>
    </div>
  </div>

  <main class="page">
    <section class="visual" aria-label="CAHAYA APP">
      <div class="brand">
        <div class="brand-mark"><img src="assets/logofi.png" alt="Logo CAHAYA"></div>
        <div class="brand-copy">
          <strong>CAHAYA APP</strong>
          <span>Pesantren Cahaya Fajrul Islam</span>
        </div>
      </div>

      <div class="visual-main">
        <h1>Bersama Bangun <span class="gold">Generasi Cahaya</span></h1>
      </div>

      <div class="feature-row" aria-hidden="true">
        <div class="feature">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 20 6.5v5.2c0 4.8-3.1 7.8-8 9.3-4.9-1.5-8-4.5-8-9.3V6.5L12 3Z" stroke="currentColor" stroke-width="1.7"/><path d="m8.7 12 2.1 2.1 4.7-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Akses sesuai peran
        </div>
        <div class="feature">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 13.5 10 18l9-12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Terintegrasi
        </div>
        <div class="feature">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2.8 19 6v5c0 4.6-2.8 7.5-7 9.2C7.8 18.5 5 15.6 5 11V6l7-3.2Z" stroke="currentColor" stroke-width="1.7"/><path d="M9 11h6v5H9z" stroke="currentColor" stroke-width="1.5"/><path d="M10.2 11V9a1.8 1.8 0 1 1 3.6 0v2" stroke="currentColor" stroke-width="1.5"/></svg>
          Aman
        </div>
      </div>
    </section>

    <section class="auth-side">
      <div class="auth-wrap">
        <section class="auth-card">
          <div class="auth-kicker">Selamat Datang</div>
          <h2 class="auth-title">Masuk ke CAHAYA APP</h2>

          <form class="login-form" id="loginForm">
            <div id="errorMsg">Username atau kata sandi tidak valid.</div>

            <div class="form-group">
              <label for="username">Username</label>
              <div class="input-shell">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.7"/>
                  <path d="M5.2 20c.4-4.2 3-6.6 6.8-6.6s6.4 2.4 6.8 6.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
                <input type="text" id="username" class="form-control" placeholder="Masukkan username" autocomplete="username" required>
              </div>
            </div>

            <div class="form-group">
              <label for="password">Kata Sandi</label>
              <div class="input-shell">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <rect x="5" y="10" width="14" height="10" rx="2.5" stroke="currentColor" stroke-width="1.7"/>
                  <path d="M8.2 10V7.7a3.8 3.8 0 1 1 7.6 0V10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
                <input type="password" id="password" class="form-control" placeholder="Masukkan kata sandi" autocomplete="current-password" required>
                <button type="button" class="toggle-password" id="togglePassword" aria-label="Lihat atau sembunyikan kata sandi">
                  <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" width="20" height="20" aria-hidden="true">
                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.7"/>
                  </svg>
                </button>
              </div>
            </div>

            <button type="submit" class="submit-btn" id="btnSubmit">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span id="btnSubmitText">Masuk</span>
            </button>
          </form>

          <div class="auth-foot">
            <div class="secure-note">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 19 6v5c0 4.6-2.8 7.5-7 9.2C7.8 18.5 5 15.6 5 11V6l7-3Z" stroke="currentColor" stroke-width="1.7"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Akses akan disesuaikan otomatis dengan akun Anda.
            </div>
            <button type="button" class="install-btn" id="tombolInstal">Instal Aplikasi</button>
          </div>
        </section>

        <p class="copyright">© 2026 Pesantren Cahaya Fajrul Islam</p>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = window.CAHAYA_CONFIG.firebase;
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let deferredInstallPrompt = null;

    function getLoginTarget(user) {
      const roles = (Array.isArray(user?.akses) ? user.akses : [user?.akses || user?.role].filter(Boolean))
        .map(r => String(r || '').toLowerCase());
      const identity = [user.cashierUnit, user.unitKasir, user.username, user.email, user.label]
        .filter(Boolean).join(' ');
      const dedicatedCashier = roles.includes('kasir') && /kasir\s*putri|kasirputri|kasir\s*putra|kasirputra/i.test(identity);
      const cashierOnly = roles.includes('kasir') && !roles.some(r => ['admin','direktur','wakil','keuangan','guru','naqib','konselor','kesehatan','sarpras','supervisor','observer','wali'].includes(r));
      if (dedicatedCashier || cashierOnly) {
        const unit = /putri/i.test(identity) ? 'putri' : /putra/i.test(identity) ? 'putra' : '';
        return unit ? `keuangan/kasir.html?unit=${unit}` : 'keuangan/kasir.html';
      }
      return roles.includes('wali')
        ? 'wali/dashboard/index.html?v=20260818-v39'
        : 'main-dashboard.html?v=20260819-v47';
    }

    function resetEyeIcon() {
      const eyeIcon = document.getElementById('eyeIcon');
      if (!eyeIcon) return;
      eyeIcon.innerHTML = `
        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.7"/>
      `;
    }

    document.getElementById('togglePassword').addEventListener('click', () => {
      const input = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        eyeIcon.innerHTML = `
          <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a16.8 16.8 0 0 1-2.7 3.4M6.1 6.2C3.7 8 2.5 12 2.5 12s3.5 6 9.5 6c1.7 0 3.2-.5 4.5-1.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        `;
      } else {
        input.type = 'password';
        resetEyeIcon();
      }
    });

    function tampilkanSistemLoading(teks) {
      const splash = document.getElementById('splashScreen');
      document.getElementById('loadingText').textContent = teks;
      splash.style.visibility = 'visible';
      splash.style.opacity = '1';
    }

    function tutupSplash() {
      const splash = document.getElementById('splashScreen');
      splash.style.opacity = '0';
      setTimeout(() => { splash.style.visibility = 'hidden'; }, 560);
    }

    setTimeout(tutupSplash, 850);

    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const button = document.getElementById('btnSubmit');
      const buttonText = document.getElementById('btnSubmitText');
      const errorBox = document.getElementById('errorMsg');
      const username = usernameInput.value.trim().toLowerCase();
      const password = passwordInput.value.trim();

      button.disabled = true;
      buttonText.textContent = 'Memeriksa akun...';
      errorBox.style.display = 'none';

      const email = username.includes('@') ? username : username + '@cahayaapp.id';
      const usernameMurni = email.split('@')[0];

      try {
        const credential = await firebase.auth().signInWithEmailAndPassword(email, password);
        const userDoc = await db.collection('users').doc(usernameMurni).get();
        let finalUserData;

        if (userDoc.exists) {
          finalUserData = userDoc.data();
          if (!finalUserData.akses) finalUserData.akses = ['wali'];
        } else {
          const isStaff = usernameMurni.includes('admin') || usernameMurni.includes('guru') || usernameMurni === 'multazam';
          finalUserData = {
            username: usernameMurni,
            label: isStaff ? 'Pengurus CAHAYA' : 'Wali Santri',
            akses: isStaff ? ['guru'] : ['wali'],
            namaAnak: usernameMurni
          };
        }

        const sessionPayload = { ...finalUserData, uid: credential.user.uid };
        localStorage.setItem('cahayaCurrentUser', JSON.stringify(sessionPayload));
        tampilkanSistemLoading('Membuka CAHAYA APP...');
        setTimeout(() => { window.location.href = getLoginTarget(sessionPayload); }, 620);
      } catch (error) {
        console.error('Login gagal:', error);
        button.disabled = false;
        buttonText.textContent = 'Masuk';
        errorBox.textContent = 'Kredensial tidak valid. Periksa kembali username dan kata sandi Anda.';
        errorBox.style.display = 'block';
      }
    });

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      deferredInstallPrompt = event;
      document.getElementById('tombolInstal').style.display = 'inline-flex';
    });

    document.getElementById('tombolInstal').addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      document.getElementById('tombolInstal').style.display = 'none';
    });

    window.addEventListener('load', () => {
      let user = null;
      try { user = JSON.parse(localStorage.getItem('cahayaCurrentUser') || 'null'); } catch (_) { user = null; }
      if (!user || !user.akses) return;
      tampilkanSistemLoading('Menghubungkan sesi...');
      setTimeout(() => { window.location.href = getLoginTarget(user); }, 420);
    });
  </script>
</body>
</html>
