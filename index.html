<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="cahaya-build" content="20260904-v130-simple-index-no-pwa">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>CAHAYA APP</title>

  <script src="config/tenant-config.js?v=130"></script>
  <script src="config/master-data.js?v=130"></script>
  <script src="js/cahaya-config-runtime.js?v=130" defer></script>

  <style>
    :root{--blue:#0b63d8;--cyan:#10a9d8;--navy:#123b6d;--muted:#71839a;--line:#dfe7ef;--bg:#f6f9fc}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--navy)}
    body{min-height:100dvh;display:grid;place-items:center;padding:24px}
    .login{width:min(100%,390px);background:#fff;border:1px solid #e4eaf1;border-radius:24px;padding:34px 28px 30px;box-shadow:0 18px 50px rgba(28,65,108,.10)}
    .brand{text-align:center;margin-bottom:30px}
    .brand img{display:block;width:82px;height:82px;object-fit:contain;margin:0 auto 12px}
    .brand h1{margin:0;font-size:30px;line-height:1;font-weight:900;letter-spacing:-1.3px;color:var(--blue)}
    .brand h1 span{color:var(--cyan)}
    .brand p{margin:8px 0 0;font-size:12px;font-weight:650;color:#57789d}
    .title{margin:0 0 18px;text-align:center;font-size:18px;font-weight:800;color:var(--navy)}
    .field{position:relative;margin-bottom:12px}
    .field input{width:100%;height:52px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 46px 0 16px;outline:none;font-size:14px;color:#244767;transition:.18s ease}
    .field input:focus{border-color:#74b5ec;box-shadow:0 0 0 4px rgba(31,126,218,.08)}
    .eye{position:absolute;right:8px;top:7px;width:38px;height:38px;border:0;background:transparent;color:#72859b;font-size:17px;cursor:pointer;border-radius:10px}
    .error{display:none;margin:4px 0 12px;padding:10px 12px;border-radius:11px;background:#fff1f0;border:1px solid #ffd2cf;color:#b73730;font-size:12px;font-weight:650}
    .submit{width:100%;height:52px;border:0;border-radius:14px;background:linear-gradient(100deg,var(--blue),#087fe8 60%,var(--cyan));color:#fff;font-size:16px;font-weight:850;cursor:pointer;box-shadow:0 12px 24px rgba(11,99,216,.20)}
    .submit:disabled{opacity:.65;cursor:wait}
    .privacy{margin:15px 0 0;text-align:center;color:var(--muted);font-size:11px;font-weight:650}
    .version{position:fixed;right:10px;bottom:8px;font-size:9px;color:#a2afbd;user-select:none}
    @media(max-width:430px){body{padding:18px}.login{padding:30px 22px 26px;border-radius:22px}.brand{margin-bottom:26px}.brand img{width:74px;height:74px}.brand h1{font-size:28px}}
  </style>
</head>
<body>
  <main class="login">
    <header class="brand">
      <img src="assets/cahaya-app/app-icon-192.png?v=130" alt="Logo CAHAYA APP" onerror="this.src='logofi.png?v=130'">
      <h1>CAHAYA <span>APP</span></h1>
      <p>Pesantren Cahaya Fajrul Islam</p>
    </header>

    <h2 class="title">Masuk ke CAHAYA APP</h2>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <input id="username" type="text" autocomplete="username" placeholder="Username" required>
      </div>
      <div class="field">
        <input id="password" type="password" autocomplete="current-password" placeholder="Kata Sandi" required>
        <button id="togglePassword" class="eye" type="button" aria-label="Tampilkan kata sandi">◉</button>
      </div>
      <div id="errorMsg" class="error"></div>
      <button id="btnSubmit" class="submit" type="submit">Masuk</button>
    </form>

    <p class="privacy">Jaga Kerahasiaan Akun Anda</p>
  </main>
  <div class="version">v130 simple</div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script>
    // Reset legacy PWA state. This page does not register a service worker or manifest.
    (async()=>{
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(k=>caches.delete(k)));
        }
      }catch(e){console.warn('PWA cleanup:',e)}
    })();

    function getLoginTarget(user){
      const roles=(Array.isArray(user?.akses)?user.akses:[user?.akses||user?.role].filter(Boolean)).map(r=>String(r||'').toLowerCase());
      const identity=[user?.cashierUnit,user?.unitKasir,user?.username,user?.email,user?.label].filter(Boolean).join(' ');
      const dedicatedCashier=roles.includes('kasir')&&/kasir\s*putri|kasirputri|kasir\s*putra|kasirputra/i.test(identity);
      const cashierOnly=roles.includes('kasir')&&!roles.some(r=>['admin','direktur','wakil','keuangan','guru','naqib','konselor','kesehatan','sarpras','supervisor','observer','manajer','staf-muda','staf-mula','wali'].includes(r));
      if(dedicatedCashier||cashierOnly){
        const unit=/putri/i.test(identity)?'putri':/putra/i.test(identity)?'putra':'';
        return unit?`keuangan/kasir.html?unit=${unit}`:'keuangan/kasir.html';
      }
      return roles.includes('wali')?'wali/dashboard/index.html?v=20260820-v70':'main-dashboard.html?v=20260904-v130';
    }

    if(window.CAHAYA_CONFIG?.firebase){
      if(!firebase.apps.length) firebase.initializeApp(window.CAHAYA_CONFIG.firebase);
    }
    const db=firebase.firestore();

    document.getElementById('togglePassword').addEventListener('click',()=>{
      const p=document.getElementById('password');
      p.type=p.type==='password'?'text':'password';
    });

    document.getElementById('loginForm').addEventListener('submit',async(e)=>{
      e.preventDefault();
      const username=document.getElementById('username').value.trim().toLowerCase();
      const password=document.getElementById('password').value.trim();
      const btn=document.getElementById('btnSubmit');
      const err=document.getElementById('errorMsg');
      btn.disabled=true; btn.textContent='Memeriksa...'; err.style.display='none';
      const email=username.includes('@')?username:username+'@cahayaapp.id';
      const uname=email.split('@')[0];
      try{
        const cred=await firebase.auth().signInWithEmailAndPassword(email,password);
        const userDoc=await db.collection('users').doc(uname).get();
        let data;
        if(userDoc.exists){data=userDoc.data();if(!data.akses)data.akses=['wali'];}
        else{
          const isStaff=uname.includes('admin')||uname.includes('guru')||uname==='multazam';
          data={username:uname,label:isStaff?'Pengurus CAHAYA':'Wali Santri',akses:isStaff?['guru']:['wali'],namaAnak:uname};
        }
        const session={...data,uid:cred.user.uid};
        localStorage.setItem('cahayaCurrentUser',JSON.stringify(session));
        btn.textContent='Membuka...';
        setTimeout(()=>location.href=getLoginTarget(session),220);
      }catch(ex){
        console.error(ex);
        btn.disabled=false; btn.textContent='Masuk';
        err.textContent='Username atau kata sandi tidak sesuai.';
        err.style.display='block';
      }
    });
  </script>
</body>
</html>
