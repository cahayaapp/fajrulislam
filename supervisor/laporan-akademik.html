<script src="../config/tenant-config.js"></script><script src="../js/cahaya-config-runtime.js"></script><script src="../js/student-program-applicability.js?v=5"></script><script src="../js/academic-report-score-policy.js?v=2"></script><script src="../js/wali-academic-report-v2.js?v=1"></script><script src="../js/academic-report-publication-v1.js?v=2"></script>
<style>
:root{--blue:#2878ff;--ink:#17294b;--muted:#70819a;--line:#dfe8f3;--green:#12845f;--amber:#a06408;--red:#b83b4b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Nunito,Inter,system-ui,sans-serif;background:#f5f8fd;color:#334766}button,input,select,textarea{font:inherit}.page{max-width:1280px;margin:auto;padding:18px 18px 56px}.hero{padding:22px 24px;border-radius:25px;background:linear-gradient(130deg,#153e77,#2878ff);color:#fff;box-shadow:0 18px 46px rgba(31,89,182,.18)}.hero-row,.head,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.hero h1{margin:4px 0;font-size:1.55rem}.hero p{margin:0;color:#e5efff;font-size:.78rem}.back,.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer}.back{background:rgba(255,255,255,.15);color:#fff}.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:14px 0;padding:15px;border:1px solid var(--line);border-radius:20px;background:#fff}.field{display:grid;gap:5px}.field label{font-size:.6rem;font-weight:1000;text-transform:uppercase;color:var(--muted)}select,input,textarea{width:100%;min-height:43px;padding:9px 11px;border:1px solid #d8e4f1;border-radius:12px;background:#fff;color:#27405f}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:13px}.metric,.report-card{border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 7px 22px rgba(31,71,116,.05)}.metric{padding:14px}.metric b{display:block;color:var(--ink);font-size:1.35rem}.metric span{font-size:.66rem;color:var(--muted);font-weight:800}.list{display:grid;gap:10px}.report-card{padding:15px}.head{align-items:flex-start}.head h2{margin:0;color:var(--ink);font-size:.96rem}.meta{margin-top:4px;color:var(--muted);font-size:.7rem;font-weight:700}.facts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.fact,.status{padding:5px 9px;border-radius:999px;background:#eff5fc;color:#3a5d82;font-size:.62rem;font-weight:900}.status.ready,.status.published{background:#e7f7f1;color:var(--green)}.status.revision{background:#ffedf0;color:var(--red)}.status.draft{background:#fff3dd;color:var(--amber)}.actions{justify-content:flex-start;flex-wrap:wrap}.btn{background:#edf4ff;color:#235fae}.btn.primary{background:linear-gradient(135deg,#1765dc,#2878ff);color:#fff}.btn.warn{background:#fff3dd;color:#925d08}.btn.red{background:#ffedf0;color:#ad3445}.btn:disabled{opacity:.45;cursor:not-allowed}.empty{padding:30px;text-align:center;border:1px dashed #cadaec;border-radius:18px;background:#fff;color:var(--muted)}.overlay{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:14px;background:rgba(10,27,51,.62);backdrop-filter:blur(4px)}.overlay.show{display:grid}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:22px;background:#fff}.modal-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:10px;padding:15px;border-bottom:1px solid var(--line);background:#fff}.modal-head h3{margin:0;color:var(--ink)}.modal-body{padding:15px}.close{border:0;border-radius:10px;background:#edf2f8;padding:8px 11px;cursor:pointer}.period-report-card{margin-bottom:10px;padding:15px;border:1px solid var(--line);border-radius:16px}.period-report-head{display:flex;justify-content:space-between;gap:10px}.period-report-head h4{margin:0;color:var(--ink)}.period-report-score{font-size:1.4rem;font-weight:1000;color:#1765dc}.period-report-meta,.period-report-note{margin-top:5px;color:var(--muted);font-size:.7rem}.period-report-components{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.period-report-components span,.report-remedial{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eff6ff;font-size:.62rem;font-weight:800}.report-remedial{margin-top:8px;background:#e7f7f1;color:#087c72}.review-form{display:grid;gap:8px;margin-top:14px}.toast{position:fixed;right:14px;bottom:14px;z-index:50;padding:11px 14px;border-radius:13px;background:#172c50;color:#fff;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}
@media(max-width:760px){.page{padding:10px 9px 44px}.hero{padding:17px}.hero-row{align-items:flex-start}.filters{grid-template-columns:1fr 1fr;padding:11px}.field:last-child{grid-column:1/-1}.metrics{grid-template-columns:1fr 1fr}.head{display:block}.status{display:inline-flex;margin-top:8px}.actions .btn{flex:1 1 45%}.modal{max-height:96vh}select,input,textarea{font-size:16px}}@media(max-width:390px){.filters{grid-template-columns:1fr}.field:last-child{grid-column:auto}.actions .btn{flex-basis:100%}}
</style></head><body><main class="page"><section class="hero"><div class="hero-row"><div><small>KONTROL PUBLIKASI RAPOR</small><h1>Laporan Akademik</h1><p>Review laporan Final Guru sebelum diterbitkan kepada Wali Santri.</p></div><button class="back" onclick="location.href='review-pendidikan.html'">← Review Pendidikan</button></div></section>
<section class="filters"><div class="field"><label>Tahun Akademik</label><select id="year"></select></div><div class="field"><label>Jenis Laporan</label><select id="type"><option value="bulanan">Bulanan</option><option value="triwulan">Triwulan</option><option value="semester">Semester</option></select></div><div class="field"><label>Periode</label><select id="period"></select></div><div class="field"><label>Kelas</label><select id="classFilter"><option value="">Semua Kelas</option></select></div><div class="field"><label>Santri</label><input id="studentFilter" placeholder="Cari nama santri"></div></section>
<section class="metrics" id="metrics"></section><section class="list" id="list"><div class="empty">Memuat data rapor…</div></section></main>
<div class="overlay" id="preview"><section class="modal"><header class="modal-head"><div><h3 id="previewTitle">Preview Rapor</h3><div class="meta" id="previewMeta"></div></div><button class="close" onclick="closeModal('preview')">✕</button></header><div class="modal-body" id="previewBody"></div></section></div>
<div class="overlay" id="revision"><section class="modal"><header class="modal-head"><h3>Minta Perbaikan</h3><button class="close" onclick="closeModal('revision')">✕</button></header><div class="modal-body"><p class="meta">Supervisor tidak mengubah nilai. Bila nilai Final perlu dikoreksi, lanjutkan melalui mekanisme Buka Revisi Nilai.</p><div class="review-form"><label for="revisionNote"><strong>Catatan perbaikan</strong></label><textarea id="revisionNote" placeholder="Contoh: Nilai Bahasa Arab perlu dicek kembali."></textarea><button class="btn warn" id="saveRevision">Simpan Permintaan Perbaikan</button></div></div></section></div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script>
const P=CahayaAcademicReportPublication,R=CahayaWaliAcademicReportV2,A=CahayaStudentProgramApplicability,$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!firebase.apps.length)firebase.initializeApp(window.CAHAYA_CONFIG.firebase);const db=firebase.database();let rows=[],markers={},quranAssignments={},selected=null;
function array(v){return Array.isArray(v)?v.filter(Boolean):Object.entries(v||{}).map(([id,x])=>({id,...(x||{})}))}function profile(){try{return JSON.parse(localStorage.getItem('cahayaCurrentUser')||'{}')}catch{return{}}}const USER=profile();function userName(){return USER.label||USER.nama||USER.username||'Supervisor Pendidikan'}function userUid(){return USER.uid||USER.userUid||USER.id||''}function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>$('toast').classList.remove('show'),2600)}
function supervisorUnit(){const active=String(localStorage.getItem('cahayaActiveRoleV2')||USER.activeRole||'').toUpperCase(),assignment=USER.assignments?.[active]||USER.activeAssignment||{};return String(assignment.unit||USER.unit||'').toUpperCase()}function recordUnit(record){const value=P.norm(P.classOf(record)+' '+(record.unit||record.area||''));return value.includes('putri')?'PUTRI':value.includes('putra')?'PUTRA':''}function currentYear(){const d=new Date(),y=d.getFullYear(),s=d.getMonth()>=6?y:y-1;return `${s}/${s+1}`}function contextRows(){const type=$('type').value,year=$('year').value,period=$('period').value,unit=supervisorUnit();return rows.filter(x=>(!unit||unit==='ALL'||recordUnit(x)===unit)&&R.typeOf(x)===type&&P.norm(R.yearOf(x))===P.norm(year)&&P.norm(R.periodOf(x,type))===P.norm(period))}function dateFor(record){return A.periodDate({tahun_akademik:$('year').value,periode:$('period').value,tanggal:record?.tanggal_ujian})}function applicable(record,student){return A.applicable(student.name,record,dateFor(record),quranAssignments,record,{className:student.kelas,studentId:student.studentKey}).applicable}
function markerFor(s){let node=markers?.[P.stableStudentKey(s.studentKey)]?.[P.key($('year').value)]?.[P.key($('type').value)]?.[P.key($('period').value)];return node||null}function studentRows(all){const map=new Map();all.forEach(r=>{const studentKey=P.studentKeyOf(r),name=String(r.nama_santri||r.namaSantri||r.nama||'Santri'),kelas=P.classOf(r),id=studentKey||P.key(`${name}-${kelas}`);if(!map.has(id))map.set(id,{studentKey:id,name,kelas,records:[]});map.get(id).records.push(r)});return [...map.values()]}
function timeOf(value){if(typeof value==='number')return value<1e12?value*1000:value;const numeric=Number(value);if(Number.isFinite(numeric)&&String(value).trim()!=='')return numeric<1e12?numeric*1000:numeric;return Date.parse(value||0)||0}function updatedAfterRequest(records,marker){const requested=timeOf(marker?.reviewedAt||marker?.revisionRequestedAt);return requested>0&&records.some(r=>timeOf(r.final_at||r.finalAt||r.updated_at||r.updatedAt||r.timestamp)>requested)}function stateFor(student,ready){const marker=markerFor(student);return P.effectiveStatus(marker,ready,updatedAfterRequest(ready.records,marker))}function cssStatus(s){return s===P.STATUS.PUBLISHED?'published':s===P.STATUS.READY?'ready':s===P.STATUS.NEEDS_REVISION?'revision':'draft'}
function render(){const all=contextRows(),students=studentRows(all),className=$('classFilter').value,query=P.norm($('studentFilter').value);const visible=students.filter(s=>(!className||s.kelas===className)&&(!query||P.norm(s.name).includes(query))).map(student=>{const ready=P.readiness({allRecords:all,studentRecords:student.records,type:$('type').value,year:$('year').value,period:$('period').value,student,applicable});return{student,ready,status:stateFor(student,ready)}});const statuses=visible.reduce((a,x)=>(a[x.status]=(a[x.status]||0)+1,a),{});$('metrics').innerHTML=[[visible.length,'Rapor'],[statuses[P.STATUS.DRAFT]||0,'Draft'],[statuses[P.STATUS.READY]||0,'Siap Ditinjau'],[statuses[P.STATUS.PUBLISHED]||0,'Dipublikasikan']].map(x=>`<div class="metric"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');$('list').innerHTML=visible.length?visible.map((x,i)=>`<article class="report-card"><div class="head"><div><h2>${esc(x.student.name)}</h2><div class="meta">${esc(x.student.kelas||'Kelas belum tersedia')} • ${esc(P.TYPES[$('type').value].label)} • ${esc($('period').value)}</div></div><span class="status ${cssStatus(x.status)}">${P.statusLabel(x.status)}</span></div><div class="facts"><span class="fact">Kelengkapan ${x.ready.final}/${x.ready.expected||'—'}</span><span class="fact">${x.ready.final} Mapel Final</span><span class="fact">${x.ready.remedial} Remedial</span></div><div class="actions"><button class="btn" onclick="previewReport(${i})">Lihat Rapor</button><button class="btn warn" onclick="requestRevision(${i})" ${x.status===P.STATUS.PUBLISHED?'disabled':''}>Minta Perbaikan</button>${x.status===P.STATUS.PUBLISHED?`<button class="btn red" onclick="withdrawReport(${i})">Tarik Publikasi</button>`:`<button class="btn primary" onclick="publishReport(${i})" ${x.status!==P.STATUS.READY?'disabled':''}>Publikasikan</button>`}</div></article>`).join(''):'<div class="empty">Belum ada data rapor pada filter ini.</div>';window.__visibleReports=visible}
function populatePeriods(){const config=P.TYPES[$('type').value];$('period').innerHTML=config.periods.map(x=>`<option>${x}</option>`).join('');render()}function populateFilters(){const years=R.years(rows,currentYear());$('year').innerHTML=years.map(y=>`<option>${y}</option>`).join('');const classes=[...new Set(rows.map(P.classOf).filter(Boolean))].sort();$('classFilter').innerHTML='<option value="">Semua Kelas</option>'+classes.map(x=>`<option>${esc(x)}</option>`).join('');populatePeriods()}
function closeModal(id){$(id).classList.remove('show')}function previewReport(i){const x=window.__visibleReports[i];if(!x)return;$('previewTitle').textContent=`${P.TYPES[$('type').value].title} • ${x.student.name}`;$('previewMeta').textContent=`${x.student.kelas} • ${$('period').value} • ${$('year').value}`;$('previewBody').innerHTML=x.ready.records.length?P.renderScoreCards(x.ready.records):'<div class="empty">Belum ada nilai Final untuk dipreview.</div>';$('preview').classList.add('show')}function requestRevision(i){selected=window.__visibleReports[i];$('revisionNote').value='';$('revision').classList.add('show')}
function markerPath(student){return P.path({studentKey:student.studentKey,tahunAkademik:$('year').value,type:$('type').value,period:$('period').value})}function markerPayload(student,status,extra={}){return{reportType:$('type').value,period:$('period').value,tahunAkademik:$('year').value,studentKey:student.studentKey,studentName:student.name,kelas:student.kelas,status,updatedAt:new Date().toISOString(),updatedByUid:userUid(),updatedByName:userName(),...extra}}
async function mutate(student,status,extra,message){const path=markerPath(student),stamp=Date.now();await db.ref(path).transaction(current=>{const next={...(current||{}),...markerPayload(student,status,extra)};next.history={...(current?.history||{}),[stamp]:{status,at:next.updatedAt,byUid:userUid(),byName:userName(),note:extra.reviewNote||extra.withdrawNote||''}};return next});markers=(await db.ref('cahaya_app/rapor_publication').once('value')).val()||{};render();toast(message)}
$('saveRevision').onclick=async()=>{const note=$('revisionNote').value.trim();if(!note){toast('Catatan perbaikan wajib diisi.');return}try{await mutate(selected.student,P.STATUS.NEEDS_REVISION,{reviewNote:note,reviewedAt:new Date().toISOString(),reviewedByUid:userUid(),reviewedByName:userName()},'Permintaan perbaikan disimpan.');closeModal('revision')}catch(e){toast('Gagal menyimpan: '+e.message)}};
async function publishReport(i){const x=window.__visibleReports[i];if(!x?.ready.ready)return;if(!confirm(`Publikasikan ${P.TYPES[$('type').value].label} ${$('period').value} untuk ${x.student.name}?`))return;try{await mutate(x.student,P.STATUS.PUBLISHED,{publishedAt:new Date().toISOString(),publishedByUid:userUid(),publishedByName:userName()},'Rapor dipublikasikan kepada Wali.')}catch(e){toast('Gagal mempublikasikan: '+e.message)}}async function withdrawReport(i){const x=window.__visibleReports[i];const reason=prompt('Alasan menarik publikasi (wajib):','');if(!reason?.trim())return;try{await mutate(x.student,P.STATUS.WITHDRAWN,{withdrawNote:reason.trim(),withdrawnAt:new Date().toISOString(),withdrawnByUid:userUid(),withdrawnByName:userName()},'Publikasi ditarik dan tercatat.')}catch(e){toast('Gagal menarik publikasi: '+e.message)}}
async function load(){try{const [monthly,periodic,pubs,quran]=await Promise.all(['cahaya_app/nilai_ujian_bulanan','cahaya_app/nilai_ujian','cahaya_app/rapor_publication','cahaya_app/program_quran_santri'].map(p=>db.ref(p).once('value')));rows=[...array(monthly.val()).map(x=>({...x,__sourceType:'Bulanan'})),...array(periodic.val()).map(x=>({...x,__sourceType:'Periodik'}))];markers=pubs.val()||{};quranAssignments=quran.val()||{};populateFilters()}catch(e){$('list').innerHTML=`<div class="empty">Gagal memuat kontrol publikasi: ${esc(e.message)}</div>`}}
$('type').onchange=populatePeriods;$('year').onchange=render;$('period').onchange=render;$('classFilter').onchange=render;$('studentFilter').oninput=render;load();
</script></body></html>
