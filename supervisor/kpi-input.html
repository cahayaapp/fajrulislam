<!DOCTYPE html>
<html lang="id">
<head>
  <!-- CAHAYA WHITE-LABEL CONFIG -->
  <script src="../config/tenant-config.js"></script>
  <script src="../config/master-data.js"></script>
  <script src="../js/cahaya-config-runtime.js" defer></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2878ff" />
  <title>KPI Naqib | CAHAYA APP</title>
  <link rel="stylesheet" href="../css/cahaya-theme.css?v=24" />
  <link rel="stylesheet" href="../css/cahaya-unified-v24.css?v=24" />
  <style>
    body{margin:0;padding:18px}.kpi24{width:min(880px,100%);margin:0 auto}.kpi24-hero{padding:25px 27px;margin-bottom:15px}.kpi24-form{padding:20px}.kpi24-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.kpi24-field{display:grid;gap:7px}.kpi24-field.full{grid-column:1/-1}.kpi24-field label{color:#344969;font-size:.78rem;font-weight:950}.kpi24-field input,.kpi24-field select,.kpi24-field textarea{width:100%;padding:12px 13px;border:1.5px solid #dce6f3;border-radius:13px;background:#f9fbff;color:#1f2d4d;font:inherit}.kpi24-field textarea{min-height:105px;resize:vertical}.kpi24-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}.kpi24-actions button{min-height:46px;padding:11px 18px;border:0;border-radius:13px;color:#fff;font-weight:950;background:linear-gradient(135deg,#2878ff,#19c6e6);box-shadow:0 9px 22px rgba(40,120,255,.2)}#hasil{margin-top:14px}@media(max-width:640px){body{padding:8px}.kpi24-grid{grid-template-columns:1fr}.kpi24-form{padding:14px}.kpi24-hero{padding:20px 17px}.kpi24-actions button{width:100%}}
  </style>
</head>
<body>
  <main class="kpi24">
    <section class="hero kpi24-hero"><span class="hero-label">📊 Supervisor</span><h1>KPI Naqib CAHAYA</h1><p>Penilaian ringkas untuk mendukung pembinaan dan tindak lanjut Naqib.</p></section>
    <section class="cahaya-card kpi24-form">
      <div class="kpi24-grid">
        <div class="kpi24-field full"><label for="namaNaqib">Pilih Naqib</label><select id="namaNaqib"><option>Naqib A</option><option>Naqib B</option></select></div>
        <div class="kpi24-field"><label for="d1">Kehadiran & Adab (1–5)</label><input type="number" id="d1" min="1" max="5" /></div>
        <div class="kpi24-field"><label for="d2">Pendampingan Harian (1–5)</label><input type="number" id="d2" min="1" max="5" /></div>
        <div class="kpi24-field"><label for="d3">Mentoring & Kasus (1–5)</label><input type="number" id="d3" min="1" max="5" /></div>
        <div class="kpi24-field"><label for="d4">Refleksi & Kematangan Batin (1–5)</label><input type="number" id="d4" min="1" max="5" /></div>
        <div class="kpi24-field"><label for="d5">Kolaborasi Sistem (1–5)</label><input type="number" id="d5" min="1" max="5" /></div>
        <div class="kpi24-field full"><label for="kekuatan">Kekuatan Utama Naqib</label><textarea id="kekuatan"></textarea></div>
        <div class="kpi24-field full"><label for="penguatan">Area Penguatan</label><textarea id="penguatan"></textarea></div>
        <div class="kpi24-field full"><label for="rekomendasi">Rekomendasi Pendampingan</label><textarea id="rekomendasi"></textarea></div>
      </div>
      <div class="kpi24-actions"><button type="button" onclick="simpanKPI()">Simpan KPI</button></div>
      <div id="hasil"></div>
    </section>
  </main>
  <script src="kpi-input.js"></script>
  <script src="../js/cahaya-responsive-v24.js?v=24" defer></script>
</body>
</html>
