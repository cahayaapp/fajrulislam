function collect(node,test,out=[]){if(!node||typeof node!=='object')return out;if(!Array.isArray(node)&&test(node)){out.push(node);return out}Object.values(node).forEach(v=>collect(v,test,out));return out}

function dueSchedules(rows,ctx){const START=clockMinutes('05:10');return rows.filter(r=>{if(!r||r.aktif===false||Number(r.hari)!==Number(ctx.day))return false;const tm=clockMinutes(r.jamMulai||String(r.waktu||'').split(/[–—-]/)[0]);return Number.isFinite(tm)&&tm>=START&&tm<=ctx.minutes})}

function finalStudentStatus(item={}){const awal=String(item.statusAwal||item.status||'').trim(),akhir=String(item.statusAkhir||item.statusFinal||'').trim();let s=akhir||(norm(awal)==='belum hadir'?'':awal);s=norm(s);if(!s)return'';if(s==='h'||s.includes('hadir')||s.includes('terlambat'))return'H';if(s==='s'||s.includes('sakit'))return'S';if(s==='i'||s.includes('izin'))return'I';if(s==='a'||s.includes('alfa')||s.includes('alpha'))return'A';return''}

function classLookup(){const cls=window.CAHAYA_MASTER_DATA?.santriByClass||{};const out=new Map();Object.entries(cls).forEach(([kelas,names])=>{if(!/^Kelas\s+\d+\s+(Putra|Putri)$/i.test(String(kelas))||!Array.isArray(names))return;names.forEach(nm=>out.set(nameKey(nm),{name:nm,kelas,unit:/putri/i.test(kelas)?'Putri':'Putra'}))});return out}

function detailStatsHtml(arr){return arr.map(([label,value])=>`<div class="detail-stat"><small>${esc(label)}</small><b>${esc(value)}</b></div>`).join('')}
function detailNamesHtml(g){const labels={H:'Hadir',S:'Sakit',I:'Izin',A:'Alfa'};return Object.entries(labels).map(([k,l])=>g[k]?.length?`<div class="detail-name-line"><strong>${l}:</strong> ${g[k].map(esc).join(', ')}</div>`:'').join('')}
function openSummaryDetail(type){const modal=$('summaryDetailModal'),title=$('summaryDetailTitle'),meta=$('summaryDetailMeta'),sum=$('summaryDetailSummary'),list=$('summaryDetailList'),btn=$('summaryDetailFullBtn');if(!modal)return;const m=metrics[type]||{};let html='',route=()=>{};if(type==='teacher'){title.textContent='Detail Kehadiran Guru';meta.textContent=`Jadwal Putra/Putri yang sudah mulai • sampai ${m.clock||'—'} WIB`;sum.innerHTML=detailStatsHtml([['Jadwal waktunya',m.due||0],['Guru hadir',m.present||0],['Belum hadir',(m.due||0)-(m.present||0)],['Kehadiran',`${m.rate||0}%`]]);html=(m.rows||[]).map(({schedule:r,attendance:a})=>{const ok=!!a,nama=a?.namaGuru||a?.guruNama||r.guruNama||r.namaGuru||r.guruKode||'Guru belum terbaca',waktu=r.jamMulai||String(r.waktu||'').split(/[–—-]/)[0]||'—';return`<div class="detail-row"><div class="detail-row-head"><div><div class="detail-row-title">${esc(nama)}</div><div class="detail-row-sub">${esc(r.mapel||r.mataPelajaran||'Pembelajaran')} • ${esc(r.kelas||'—')} • ${esc(waktu)}</div></div><span class="detail-badge ${ok?'':'warn'}">${ok?'Hadir':'Belum Hadir'}</span></div></div>`}).join('')||'<div class="detail-empty">Belum ada jadwal yang masuk hitungan saat ini.</div>';route=()=>openMenu('menu-monitoring-absen-guru')}
else if(type==='learning'){title.textContent='Detail Kehadiran Belajar Santri';meta.textContent=`Semua Putra/Putri • sesi sejak Bahasa Arab Pagi • sampai ${m.clock||'—'} WIB`;const d=m.dist||{};sum.innerHTML=detailStatsHtml([['Hadir',`${d.pH||0}%`],['Sakit',`${d.pS||0}%`],['Izin',`${d.pI||0}%`],['Alfa',`${d.pA||0}%`]]);html=(m.rows||[]).map(({schedule:r,records})=>{const items=(records||[]).flatMap(x=>x.data||[]),dist=distribution(records||[],finalStudentStatus,(x,nm)=>`${x.jadwalId||x.id||x.kelas||'sesi'}|${nameKey(nm)}`),names=listNames(items,finalStudentStatus),waktu=r.jamMulai||'—';return`<div class="detail-row"><div class="detail-row-head"><div><div class="detail-row-title">${esc(r.mapel||r.mataPelajaran||'Pembelajaran')} • ${esc(r.kelas||'—')}</div><div class="detail-row-sub">Mulai ${esc(waktu)} • ${records?.length?'Absensi tercatat':'Belum ada absensi'}</div></div><span class="detail-badge ${records?.length?'':'warn'}">${records?.length?'Tercatat':'Belum Masuk'}</span></div><div class="detail-status-grid"><span class="detail-status"><b>${dist.H}</b>Hadir</span><span class="detail-status"><b>${dist.S}</b>Sakit</span><span class="detail-status"><b>${dist.I}</b>Izin</span><span class="detail-status"><b>${dist.A}</b>Alfa</span></div><div class="detail-names">${detailNamesHtml(names)}</div></div>`}).join('')||'<div class="detail-empty">Belum ada sesi pembelajaran yang masuk hitungan.</div>';route=()=>openMenu('menu-kontrol-pendidikan')}
else if(type==='program'){title.textContent='Detail Kehadiran Program Santri';meta.textContent=`Semua Putra/Putri • program sejak Qiyamullail • sampai ${m.clock||'—'} WIB`;const d=m.dist||{};sum.innerHTML=detailStatsHtml([['Hadir',`${d.pH||0}%`],['Sakit',`${d.pS||0}%`],['Izin',`${d.pI||0}%`],['Alfa',`${d.pA||0}%`]]);html=(m.rows||[]).map(({name,time,records})=>{const items=(records||[]).flatMap(x=>x.data||[]),dist=distribution(records||[],programStatus,(x,nm)=>`${norm(x.program||x.namaProgram||x.nama)}|${nameKey(nm)}|${norm(x.unit||x.kelompok||x.asrama||'')}`),names=listNames(items,programStatus);return`<div class="detail-row"><div class="detail-row-head"><div><div class="detail-row-title">${esc(name)}</div><div class="detail-row-sub">Mulai ${esc(time)} • ${records?.length?`${records.length} data/unit tercatat`:'Belum ada absensi'}</div></div><span class="detail-badge ${records?.length?'':'warn'}">${records?.length?'Tercatat':'Belum Masuk'}</span></div><div class="detail-status-grid"><span class="detail-status"><b>${dist.H}</b>Hadir</span><span class="detail-status"><b>${dist.S}</b>Sakit</span><span class="detail-status"><b>${dist.I}</b>Izin</span><span class="detail-status"><b>${dist.A}</b>Alfa</span></div><div class="detail-names">${detailNamesHtml(names)}</div></div>`}).join('')||'<div class="detail-empty">Belum ada program yang masuk hitungan setelah Qiyamullail.</div>';route=()=>openMenu('menu-kontrol-pembinaan')}
else if(type==='tahfiz'){title.textContent='Detail Setoran Hafalan Tahfiz';meta.textContent='Putra/Putri yang terpetakan dari target Tahfiz + mapping kelas Putri';sum.innerHTML=detailStatsHtml([['Santri Tahfiz',m.total||0],['Setor hari ini',`${m.submitted||0} (${m.rate||0}%)`],['Punya target',m.withTarget||0],['Capai target',m.achieved||0]]);html=(m.rows||[]).map(r=>{const status=r.achieved?'Capai Target':r.submitted?'Belum Target':'Belum Setor',cls=r.achieved?'':r.submitted?'warn':'bad';return`<div class="detail-row"><div class="detail-row-head"><div><div class="detail-row-title">${esc(r.name)}</div><div class="detail-row-sub">${esc(r.kelas)} • ${esc(r.unit)} • ${r.baris||0} baris hari ini / target ${r.target||'—'}</div></div><span class="detail-badge ${cls}">${status}</span></div></div>`}).join('')||'<div class="detail-empty">Belum ada basis santri Tahfiz yang dapat ditampilkan.</div>';route=()=>openMenu('menu-dashboard-pendidikan')}
list.innerHTML=html;btn.onclick=()=>{closeModal('summaryDetailModal');route()};modal.classList.add('show')}
function attentionHtml(a,modal=false){const tone=a.tone==='amber'?'amber':a.tone==='blue'?'blue':'';const click=a.menu?`openMenu('${a.menu}')`:a.route?`openRoute('${a.route}')`:'';if(modal)return`<button class="division-row" onclick="closeModal('attentionModal');${click}"><span class="dicon" style="--dsoft:${a.tone==='red'?'#ffe9e7':a.tone==='amber'?'#fff3db':'#eaf4ff'};--dcolor:${a.tone==='red'?'#c53d33':a.tone==='amber'?'#a56d0b':'#236ac6'}">${iconMap[a.key?.startsWith('char')?'pembinaan':a.key?.startsWith('health')?'kesehatan':a.key?.startsWith('sar')?'sarpras':a.key?.startsWith('sec')?'keamanan':a.key?.startsWith('fin')?'keuangan':'pendidikan']}</span><span class="dcopy"><b>${esc(a.title)}</b><small>${esc(a.desc)}</small></span><span class="dstatus ${a.tone==='red'?'bad':a.tone==='amber'?'att':''}">${a.count}</span></button>`;return`<button class="attention-card ${tone}" onclick="${click}"><span class="att-icon">${iconMap[a.key?.startsWith('health')?'kesehatan':a.key?.startsWith('char')?'pembinaan':a.key?.startsWith('sar')?'sarpras':a.key?.startsWith('sec')?'keamanan':a.key?.startsWith('fin')?'keuangan':'pendidikan']}</span><div class="att-count">${a.count}</div><div class="att-title">${esc(a.title)}</div><div class="att-desc">${esc(a.desc)}</div><span class="att-arrow"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span></button>`}
function renderAttentions(){attentions=attentions.sort((a,b)=>b.severity-a.severity||b.count-a.count);$('notifyBadge').textContent=attentions.length>9?'9+':attentions.length;$('notifyBadge').style.display=attentions.length?'grid':'none';$('attentionGrid').innerHTML=attentions.length?attentions.slice(0,3).map(a=>attentionHtml(a)).join(''):'<div class="att-empty"><b>Belum ada exception strategis yang terdeteksi.</b><br/>Ringkasan akan berubah otomatis mengikuti data operasional yang masuk.</div>';$('attentionList').innerHTML=attentions.length?attentions.map(a=>attentionHtml(a,true)).join(''):'<div class="att-empty">Belum ada hal mendesak yang terdeteksi.</div>'}
function renderDivisionList(){const defaultText={pendidikan:'Pembelajaran, Qur’an, nilai & tindak lanjut',pembinaan:'Program, pendampingan, asesmen & kasus',kesehatan:'UKS, pemeriksaan, rujukan & obat',sarpras:'Checklist, kerusakan & perbaikan',keamanan:'Keamanan area & kebersihan',layanan:'Tamu, penitipan & layanan',keuangan:'Tagihan, pembayaran & kasir',dapur:'Konsumsi, produksi & distribusi',media:'Publikasi, dokumentasi & kanal digital'};$('divisionList').innerHTML=divisionDefs.map(([k,label,soft,color])=>{const s=summaries[k]||{value:'—',attention:0},st=statusFor(s.attention);return`<button class="division-row" onclick="openDivision('${k}')"><span class="dicon" style="--dsoft:${soft};--dcolor:${color}">${iconMap[k]}</span><span class="dcopy"><b>${label}</b><small>${esc(s.value)} · ${defaultText[k]}</small></span><span class="dstatus ${st[0]==='bad'?'bad':st[0]==='att'?'att':''}">${st[1]}</span></button>`}).join('')}
function openDivisionModal(){$('divisionModal').classList.add('show')}

function openRoleModal(){let user={};try{user=JSON.parse(localStorage.getItem('cahayaCurrentUser')||'{}')}catch{}const roles=Array.isArray(user.workspaceRoles)?user.workspaceRoles:(Array.isArray(user.akses)?user.akses:[]);const active=String(user.activeRole||localStorage.getItem('cahayaActiveRole')||'direktur').toLowerCase();const labels={direktur:'Direktur','supervisor-pendidikan':'Supervisor Pendidikan','manajer-pendidikan':'Manajer Pendidikan','supervisor-pembinaan':'Supervisor Pembinaan','manajer-pembinaan':'Manajer Pembinaan','naqib-pendamping':'Naqib Pendamping','naqib-operasional':'Naqib Operasional',guru:'Guru','mentor-quran':'Mentor Qur’an',admin:'Administrator'};const list=[...new Set(roles.length?roles:['direktur'])];$('roleList').innerHTML=list.map(r=>`<button class="role-option ${String(r).toLowerCase()===active?'active':''}" onclick="chooseRole('${esc(String(r).toLowerCase())}')">${esc(labels[String(r).toLowerCase()]||r)}</button>`).join('');$('roleModal').classList.add('show')}
async function chooseRole(role){closeModal('roleModal');try{if(typeof P.setCahayaActiveRole==='function'){await P.setCahayaActiveRole(role);P.openAuthorizedMenu?.('menu-home')}}catch(e){console.warn(e)}}
function closeModal(id){$(id)?.classList.remove('show')}
const HIJRI_MONTHS=['Muharam','Safar','Rabiul Awal','Rabiul Akhir','Jumadil Awal','Jumadil Akhir','Rajab','Syakban','Ramadan','Syawal','Zulkaidah','Zulhijah'];
function hijriCivil(date){const g=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(date).split('-').map(Number),Y=g[0],M=g[1],D=g[2],a=Math.floor((14-M)/12),y=Y+4800-a,m=M+12*a-3,jdn=D+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045,l0=jdn-1948440+10632,n0=Math.floor((l0-1)/10631);let l=l0-10631*n0+354,j=(Math.floor((10985-l)/5316))*Math.floor((50*l)/17719)+Math.floor(l/5670)*Math.floor((43*l)/15238);l=l-Math.floor((30-j)/15)*Math.floor((17719*j)/50)-Math.floor(j/16)*Math.floor((15238*j)/43)+29;const hm=Math.floor((24*l)/709),hd=l-Math.floor((709*hm)/24),hy=30*n0+j-30;return`${hd} ${HIJRI_MONTHS[hm-1]||''} ${hy} H`}
function hijriLabel(date){try{const f=new Intl.DateTimeFormat('en-US-u-ca-islamic',{timeZone:'Asia/Jakarta',day:'numeric',month:'numeric',year:'numeric'});if(String(f.resolvedOptions().calendar||'').startsWith('islamic')){const p={};f.formatToParts(date).forEach(x=>{if(x.type!=='literal')p[x.type]=x.value});const mm=Number(p.month),dd=Number(p.day),yy=Number(p.year);if(mm>=1&&mm<=12&&dd&&yy)return`${dd} ${HIJRI_MONTHS[mm-1]} ${yy} H`}}catch(e){}return hijriCivil(date)}
function initIdentity(){let u={};try{u=JSON.parse(localStorage.getItem('cahayaCurrentUser')||'{}')}catch{}const name=String(u.label||u.nama||u.username||'Pengguna').trim(),first=name.split(/\s+/)[0]||'P';$('greeting').textContent=`Assalamu’alaikum, ${name}`;if(u.fotoProfil){$('avatarBtn').innerHTML=`<img src="${esc(u.fotoProfil)}" alt="Profil">`}else $('avatarBtn').textContent=first.charAt(0).toUpperCase();const now=new Date();$('dateM').textContent=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);$('dateH').textContent=hijriLabel(now)}
