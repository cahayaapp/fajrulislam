<body>
<main class="app">
  <header class="brand-row">
    <div class="brand">
      <img src="assets/cahaya-app/logo-icon.png?v=54" alt="CAHAYA APP" />
      <div class="brand-copy"><strong>CAHAYA APP</strong><button class="brand-role" type="button" onclick="openRoleModal()"><b>Direktur</b><svg viewBox="0 0 24 24"><path d="m7 9 5 5 5-5"/></svg></button></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" type="button" onclick="openAttentionModal()" aria-label="Perlu perhatian">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span class="notify-dot" id="notifyBadge">0</span>
      </button>
      <button class="avatar" type="button" onclick="openMenu('menu-profil')" id="avatarBtn">D</button>
    </div>
  </header>

  <section class="intro">
    <div class="greeting">
      <h1 id="greeting">Assalamu’alaikum</h1>
      <div class="date-line">
        <span><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg><b id="dateM">Hari ini</b></span>
        <i class="date-sep hijri-sep"></i>
        <span class="hijri-date"><svg viewBox="0 0 24 24"><path d="M20 15.5A8 8 0 1 1 8.5 4 6.5 6.5 0 0 0 20 15.5z"/></svg><b id="dateH">—</b></span>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2>Ringkasan Pondok</h2><button class="link-btn" type="button" onclick="openDivisionModal()">Lihat Detail <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button></div>
    <div class="summary-grid" id="summaryGrid">
      <button class="summary-card edu" onclick="openDivision('pendidikan')"><div class="summary-top"><span class="summary-icon"><svg viewBox="0 0 24 24"><path d="m3 10 9-5 9 5-9 5-9-5z"/><path d="M7 12.5V17c3 2 7 2 10 0v-4.5M21 10v6"/></svg></span><div><div class="summary-title">Pendidikan</div><div class="status-line"><i class="status-dot" id="eduDot"></i><span id="eduStatus">Memuat</span></div></div></div><div class="summary-value" id="eduValue">—</div><div class="summary-label" id="eduLabel">KBM tercatat hari ini</div><div class="summary-mini-chart"><i></i><i></i><i></i><i></i></div></button>

<script>
const $=id=>document.getElementById(id), P=window.parent&&window.parent!==window?window.parent:window;
const iconMap={
 pendidikan:'<svg viewBox="0 0 24 24"><path d="m3 10 9-5 9 5-9 5-9-5z"/><path d="M7 12.5V17c3 2 7 2 10 0v-4.5"/></svg>',
 pembinaan:'<svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2.5 19c.5-4 2.4-6 5.5-6s5 2 5.5 6M10.5 19c.5-4 2.4-6 5.5-6s5 2 5.5 6"/></svg>',
 kesehatan:'<svg viewBox="0 0 24 24"><path d="M12 21C6 17.5 3 14.5 3 10a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 4.5-3 7.5-9 11z"/><path d="M12 8v6M9 11h6"/></svg>',
 sarpras:'<svg viewBox="0 0 24 24"><path d="M14 6a4 4 0 0 0-5-4l2.2 2.2-3 3L6 5A4 4 0 0 0 10 10l8 8 3-3-8-8"/><path d="m4 20 6-6"/></svg>',
 keamanan:'<svg viewBox="0 0 24 24"><path d="M12 3 20 6v6c0 5-3.2 8.3-8 10-4.8-1.7-8-5-8-10V6l8-3z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg>',
 layanan:'<svg viewBox="0 0 24 24"><path d="M7 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM17 10a3 3 0 1 0 0-6"/><path d="M1.5 21c.5-5 2.6-7 5.5-7s5 2 5.5 7M13 21c.4-4 2-6 4.5-6s4.1 2 4.5 6"/></svg>',
 keuangan:'<svg viewBox="0 0 24 24"><path d="M4 6h14a2 2 0 0 1 2 2v12H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h12"/><path d="M20 11h-5a2 2 0 0 0 0 4h5"/></svg>',
 dapur:'<svg viewBox="0 0 24 24"><path d="M5 14h14a7 7 0 0 1-14 0zM8 10c0-2 2-2 2-4M13 10c0-2 2-2 2-4"/></svg>',
 media:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m8 13 3-3 5 5 2-2 3 3"/><circle cx="8" cy="9" r="1.5"/></svg>'
};
const divisionDefs=[
 ['pendidikan','Pendidikan','#eaf2ff','#1c64c8'],['pembinaan','Pembinaan Karakter','#e9faf3','#11835f'],['kesehatan','Kesehatan','#e8f9fb','#0a8490'],['sarpras','Sarana & Prasarana','#f1eeff','#7457bd'],['keamanan','Keamanan & Kebersihan','#fff4e4','#b87812'],['layanan','Layanan','#eaf8ff','#1684b9'],['keuangan','Administrasi & Keuangan','#eef4ff','#2856a6'],['dapur','Dapur','#fff1eb','#cc6a38'],['media','Media & Digital','#fff0f7','#b64b8a']
];
let summaries={}, attentions=[];
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function vals(v){if(Array.isArray(v))return v.filter(Boolean);return Object.entries(v||{}).map(([id,x])=>({id,...(x||{})}))}
function dateOf(x={}){return String(x.tanggal||x.tanggalPemeriksaan||x.tanggalPengajuan||x.tanggal_ujian||x.createdAt||x.timestamp||x.waktuSubmit||x.waktu||'').slice(0,10)}
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function month(){return today().slice(0,7)}
function n(v){const x=Number(v);return Number.isFinite(x)?x:0}
function norm(v){return String(v||'').trim().toLowerCase()}
function money(v){return new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(n(v))}
function compactMoney(v){const x=n(v);if(x>=1e9)return`Rp ${(x/1e9).toFixed(x>=10e9?0:1).replace('.',',')} M`;if(x>=1e6)return`Rp ${(x/1e6).toFixed(x>=10e6?0:1).replace('.',',')} jt`;if(x>=1e3)return`Rp ${(x/1e3).toFixed(0)} rb`;return`Rp ${money(x)}`}
async function recent(path,limit=240){try{const db=P.firebase?.database?.();if(!db)return[];const snap=await db.ref(path).limitToLast(limit).once('value');return vals(snap.val())}catch(e){console.warn('read',path,e);return[]}}
async function raw(path){try{const db=P.firebase?.database?.();if(!db)return{};return (await db.ref(path).once('value')).val()||{}}catch(e){return{}}}
function openMenu(id){try{if(id==='utility-menu'){P.toggleSidebar?.();return}const el=P.document?.getElementById(id);if(el&&typeof el.click==='function'){el.click();return}if(typeof P.openAuthorizedMenu==='function'){P.openAuthorizedMenu(id);return}}catch(e){console.warn(e)}}
function openRoute(route){try{if(typeof P.loadPage==='function'){P.loadPage(route,P.document.getElementById('menu-dashboard-operasional'));return}const frame=P.document?.getElementById('contentFrame');if(frame)frame.src=route}catch(e){console.warn(e)}}
function openDivision(key){closeModal('divisionModal');if(key==='pendidikan'){openMenu('menu-dashboard-pendidikan');return}if(key==='pembinaan'){openMenu('menu-dashboard-dua-divisi');return}openRoute(`dashboard-operasional/divisi.html?division=${encodeURIComponent(key)}&view=executive&v=86`)}
function setStatus(prefix,level,text){const dot=$(prefix+'Dot');if(dot)dot.className='status-dot'+(level==='bad'?' bad':level==='att'?' att':'');$(prefix+'Status').textContent=text}
function statusFor(att){return att>=5?['bad','Perlu Evaluasi']:att>0?['att','Perlu Perhatian']:['ok','Baik']}
function addAttention(item){if(item.count>0)attentions.push(item)}
async function loadData(){
  const t=today(),m=month();
  const [kbm,absent,eduIssues,prog,reports,ment,targets,assess,exams,stock,healthPerm,checks,sarActions,security,guests,items,bills,pays,dapurUpd,mediaUpd,layananUpd]=await Promise.all([
    recent('cahaya_app/absensi_pembelajaran',500),recent('cahaya_app/guru_berhalangan',180),recent('cahaya_app/masalah_pendidikan',300),
    recent('cahaya_app/absensi_program_harian',500),recent('cahaya_app/log_lapor_inisiatif',500),recent('cahaya_app/log_mentoring_naqib',350),recent('cahaya_app/target_pertumbuhan',350),recent('cahaya_app/asesmen_cahaya_santri',600),
    recent('cahaya_app/pemeriksaan_kesehatan',250),recent('cahaya_app/stok_obat_uks',250),recent('cahaya_app/perizinan_santri',250),
    recent('cahaya_app/checklist_harian_sarpras',220),recent('cahaya_app/tindak_lanjut_sarpras',350),recent('cahaya_app/jurnal_keamanan_kebersihan',220),
    recent('buku_tamu',160),recent('penitipan_barang',220),recent('cahaya_app/keuangan/tagihan',400),recent('cahaya_app/keuangan/pembayaran',400),
    recent('cahaya_app/dashboard_operasional_updates/dapur',140),recent('cahaya_app/dashboard_operasional_updates/media',140),recent('cahaya_app/dashboard_operasional_updates/layanan',140)
  ]);
  const kbmToday=kbm.filter(x=>dateOf(x)===t),unfinal=kbmToday.filter(x=>norm(x.statusFinalisasi)!=='final'&&(x.data||[]).some?.(r=>norm(r.statusAwal||r.status)==='belum hadir'&&!r.statusAkhir&&!r.statusFinal)).length;
  const absentOpen=absent.filter(x=>dateOf(x)===t&&!norm(x.statusKBM).includes('ditangani')).length;
  const eduOpen=eduIssues.filter(x=>!norm(x.status).includes('selesai')).length; const eduAtt=unfinal+absentOpen+eduOpen;
  summaries.pendidikan={value:kbmToday.length,label:'KBM tercatat hari ini',attention:eduAtt};
  addAttention({key:'edu-abs',severity:3,count:absentOpen,title:'Guru berhalangan belum tertangani',desc:'Perlu memastikan KBM tetap berjalan atau ada guru pengganti.',menu:'menu-kontrol-pendidikan',tone:'red'});
  addAttention({key:'edu-final',severity:2,count:unfinal,title:'Absensi KBM belum final',desc:'Masih ada sesi yang membutuhkan finalisasi status kehadiran santri.',menu:'menu-kontrol-pendidikan',tone:'blue'});
  addAttention({key:'edu-issue',severity:2,count:eduOpen,title:'Masalah Pendidikan masih aktif',desc:'Temuan operasional/akademik belum berstatus selesai.',menu:'menu-review-pendidikan',tone:'amber'});

  const progToday=prog.filter(x=>dateOf(x)===t);
  const isViolation=x=>norm(x.tipe).includes('pelanggaran')||x.bidangPelanggaran||x.kritis;
  const openCase=x=>{const s=norm(x.statusPenanganan||x.statusPenindakan||x.statusKonseling||x.status);return !s.includes('selesai')&&!s.includes('sudah ditindak')&&!s.includes('sudah konseling')};
  const priority=reports.filter(x=>isViolation(x)&&openCase(x)&&(x.kritis||/moral|etika|kritis|sedang/.test(norm(x.bidangPelanggaran||x.kategori||x.kategoriKhusus))));
  const overdue=targets.filter(x=>{const s=norm(x.status||'aktif');if(/selesai|tercapai|ditutup|batal/.test(s))return false;const d=Date.parse(x.deadline||x.targetSelesai||x.tanggalTarget||'');return Number.isFinite(d)&&d<Date.now()}).length;
  const charAtt=priority.length+overdue;
  summaries.pembinaan={value:progToday.length,label:'Program tercatat hari ini',attention:charAtt};
  addAttention({key:'char-case',severity:4,count:priority.length,title:'Kasus Pembinaan prioritas',desc:'Kasus moral, sedang, atau kritis yang belum selesai ditangani.',menu:'menu-review-pembinaan',tone:'red'});
  addAttention({key:'char-target',severity:2,count:overdue,title:'Target pertumbuhan melewati tenggat',desc:'Perlu melihat hasil pengawalan dan tindak lanjut pendampingan.',menu:'menu-pantau-pendampingan',tone:'amber'});

  const examsToday=exams.filter(x=>dateOf(x)===t),lowStock=stock.filter(x=>n(x.stokSaatIni)<=n(x.stokMinimum)&&n(x.stokMinimum)>0),urgentHealth=healthPerm.filter(x=>x.status==='MENUNGGU_PIMPINAN'&&(x.sumberPengajuan==='UKS'||x.jenisIzin==='Rujukan Medis'));
  summaries.kesehatan={value:examsToday.length,label:'Pemeriksaan hari ini',attention:lowStock.length+urgentHealth.length};
  addAttention({key:'health-stock',severity:3,count:lowStock.length,title:'Stok obat menipis',desc:'Item UKS berada pada atau di bawah stok minimum.',route:'dashboard-operasional/divisi.html?division=kesehatan&view=executive&v=86',tone:'blue'});
  addAttention({key:'health-ref',severity:4,count:urgentHealth.length,title:'Rujukan medis menunggu keputusan',desc:'Pengajuan medis membutuhkan keputusan pimpinan.',route:'dashboard-operasional/divisi.html?division=kesehatan&view=executive&v=86',tone:'red'});

  const todayPays=pays.filter(x=>dateOf(x)===t),payTotal=todayPays.reduce((s,x)=>s+n(x.nominal||x.jumlah||x.total),0),activeBills=bills.filter(x=>n(x.sisa)>0&&norm(x.status)!=='lunas');
  summaries.keuangan={value:compactMoney(payTotal),label:'Pembayaran masuk hari ini',attention:activeBills.length};
  if(activeBills.length>=10)addAttention({key:'fin-bill',severity:1,count:activeBills.length,title:'Tagihan masih aktif',desc:'Perlu evaluasi pola tunggakan jika jumlah terus meningkat.',route:'dashboard-operasional/divisi.html?division=keuangan&view=executive&v=86',tone:'amber'});

  const cToday=checks.filter(x=>dateOf(x)===t),major=cToday.reduce((s,x)=>s+n(x.rusakBerat),0),sarOpen=sarActions.filter(x=>!/selesai/i.test(String(x.status||''))).length;
  summaries.sarpras={value:cToday.length,label:'checklist hari ini',attention:major+sarOpen};
  addAttention({key:'sar-major',severity:4,count:major,title:'Kerusakan berat sarpras',desc:'Objek rusak berat terdeteksi pada checklist hari ini.',route:'dashboard-operasional/divisi.html?division=sarpras&view=executive&v=86',tone:'red'});
  const secToday=security.filter(x=>dateOf(x)===t),miss=secToday.reduce((s,x)=>s+n(x.tugasTidakTerlaksana),0);summaries.keamanan={value:secToday.length,label:'jurnal hari ini',attention:miss};
  addAttention({key:'sec-miss',severity:2,count:miss,title:'Tugas keamanan/kebersihan tidak terlaksana',desc:'Ada indikator harian yang tercatat tidak terlaksana.',route:'dashboard-operasional/divisi.html?division=keamanan&view=executive&v=86',tone:'amber'});
  const guestToday=guests.filter(x=>dateOf(x)===t),waitingItems=items.filter(x=>!String(x.statusBarang||'').toUpperCase().includes('SUDAH'));const layananIssues=layananUpd.filter(x=>x.status!=='DONE'&&x.type==='issue');summaries.layanan={value:guestToday.length,label:'tamu hari ini',attention:waitingItems.length+layananIssues.length};
  const dapurIssues=dapurUpd.filter(x=>x.status!=='DONE'),mediaIssues=mediaUpd.filter(x=>x.status!=='DONE');summaries.dapur={value:dapurIssues.length,label:'update aktif',attention:dapurIssues.length};summaries.media={value:mediaIssues.length,label:'update aktif',attention:mediaIssues.length};

  renderSummary();renderAttentions();renderDivisionList();
}
function renderSummary(){[['pendidikan','edu'],['pembinaan','char'],['kesehatan','health'],['media','media']].forEach(([k,p])=>{const s=summaries[k]||{value:'—',label:'Data belum terbaca',attention:0},st=statusFor(s.attention);$(p+'Value').textContent=s.value;$(p+'Label').textContent=s.label;setStatus(p,st[0],st[1])})}
function attentionHtml(a,modal=false){const tone=a.tone==='amber'?'amber':a.tone==='blue'?'blue':'';const click=a.menu?`openMenu('${a.menu}')`:a.route?`openRoute('${a.route}')`:'';if(modal)return`<button class="division-row" onclick="closeModal('attentionModal');${click}"><span class="dicon" style="--dsoft:${a.tone==='red'?'#ffe9e7':a.tone==='amber'?'#fff3db':'#eaf4ff'};--dcolor:${a.tone==='red'?'#c53d33':a.tone==='amber'?'#a56d0b':'#236ac6'}">${iconMap[a.key?.startsWith('char')?'pembinaan':a.key?.startsWith('health')?'kesehatan':a.key?.startsWith('sar')?'sarpras':a.key?.startsWith('sec')?'keamanan':a.key?.startsWith('fin')?'keuangan':'pendidikan']}</span><span class="dcopy"><b>${esc(a.title)}</b><small>${esc(a.desc)}</small></span><span class="dstatus ${a.tone==='red'?'bad':a.tone==='amber'?'att':''}">${a.count}</span></button>`;return`<button class="attention-card ${tone}" onclick="${click}"><span class="att-icon">${iconMap[a.key?.startsWith('health')?'kesehatan':a.key?.startsWith('char')?'pembinaan':a.key?.startsWith('sar')?'sarpras':a.key?.startsWith('sec')?'keamanan':a.key?.startsWith('fin')?'keuangan':'pendidikan']}</span><div class="att-count">${a.count}</div><div class="att-title">${esc(a.title)}</div><div class="att-desc">${esc(a.desc)}</div><span class="att-arrow"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></span></button>`}
function renderAttentions(){attentions=attentions.sort((a,b)=>b.severity-a.severity||b.count-a.count);$('notifyBadge').textContent=attentions.length>9?'9+':attentions.length;$('notifyBadge').style.display=attentions.length?'grid':'none';$('attentionGrid').innerHTML=attentions.length?attentions.slice(0,3).map(a=>attentionHtml(a)).join(''):'<div class="att-empty"><b>Belum ada exception strategis yang terdeteksi.</b><br/>Ringkasan akan berubah otomatis mengikuti data operasional yang masuk.</div>';$('attentionList').innerHTML=attentions.length?attentions.map(a=>attentionHtml(a,true)).join(''):'<div class="att-empty">Belum ada hal mendesak yang terdeteksi.</div>'}
function renderDivisionList(){const defaultText={pendidikan:'Pembelajaran, Qur’an, nilai & tindak lanjut',pembinaan:'Program, pendampingan, asesmen & kasus',kesehatan:'UKS, pemeriksaan, rujukan & obat',sarpras:'Checklist, kerusakan & perbaikan',keamanan:'Keamanan area & kebersihan',layanan:'Tamu, penitipan & layanan',keuangan:'Tagihan, pembayaran & kasir',dapur:'Konsumsi, produksi & distribusi',media:'Publikasi, dokumentasi & kanal digital'};$('divisionList').innerHTML=divisionDefs.map(([k,label,soft,color])=>{const s=summaries[k]||{value:'—',attention:0},st=statusFor(s.attention);return`<button class="division-row" onclick="openDivision('${k}')"><span class="dicon" style="--dsoft:${soft};--dcolor:${color}">${iconMap[k]}</span><span class="dcopy"><b>${label}</b><small>${esc(s.value)} · ${defaultText[k]}</small></span><span class="dstatus ${st[0]==='bad'?'bad':st[0]==='att'?'att':''}">${st[1]}</span></button>`}).join('')}
function openDivisionModal(){$('divisionModal').classList.add('show')}
function openAttentionModal(){$('attentionModal').classList.add('show')}
function openRoleModal(){let user={};try{user=JSON.parse(localStorage.getItem('cahayaCurrentUser')||'{}')}catch{}const roles=Array.isArray(user.workspaceRoles)?user.workspaceRoles:(Array.isArray(user.akses)?user.akses:[]);const active=String(user.activeRole||localStorage.getItem('cahayaActiveRole')||'direktur').toLowerCase();const labels={direktur:'Direktur','supervisor-pendidikan':'Supervisor Pendidikan','manajer-pendidikan':'Manajer Pendidikan','supervisor-pembinaan':'Supervisor Pembinaan','manajer-pembinaan':'Manajer Pembinaan','naqib-pendamping':'Naqib Pendamping','naqib-operasional':'Naqib Operasional',guru:'Guru','mentor-quran':'Mentor Qur’an',admin:'Administrator'};const list=[...new Set(roles.length?roles:['direktur'])];$('roleList').innerHTML=list.map(r=>`<button class="role-option ${String(r).toLowerCase()===active?'active':''}" onclick="chooseRole('${esc(String(r).toLowerCase())}')">${esc(labels[String(r).toLowerCase()]||r)}</button>`).join('');$('roleModal').classList.add('show')}
async function chooseRole(role){closeModal('roleModal');try{if(typeof P.setCahayaActiveRole==='function'){await P.setCahayaActiveRole(role);P.openAuthorizedMenu?.('menu-home')}}catch(e){console.warn(e)}}
function closeModal(id){$(id)?.classList.remove('show')}
function initIdentity(){let u={};try{u=JSON.parse(localStorage.getItem('cahayaCurrentUser')||'{}')}catch{}const name=String(u.label||u.nama||u.username||'Pengguna').trim();const first=name.split(/\s+/)[0]||'P';$('greeting').textContent=`Assalamu’alaikum, ${name}`;if(u.fotoProfil){$('avatarBtn').innerHTML=`<img src="${esc(u.fotoProfil)}" alt="Profil">`}else $('avatarBtn').textContent=first.charAt(0).toUpperCase();const now=new Date();$('dateM').textContent=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);try{$('dateH').textContent=new Intl.DateTimeFormat('id-ID-u-ca-islamic',{timeZone:'Asia/Jakarta',day:'numeric',month:'long',year:'numeric'}).format(now).replace(' AH',' H')}catch{$('dateH').textContent='Kalender Hijriah'}}
initIdentity();loadData();
</script>
