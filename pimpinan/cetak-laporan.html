104,.11)}.report-card.active{border-color:#8fb9ff;box-shadow:0 0 0 3px #e8f1ff}.report-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:1.25rem;background:#edf5ff;margin-bottom:10px}.report-card strong{display:block;font-size:.76rem}.report-card span{display:block;margin-top:4px;color:#758397;font-size:.57rem;line-height:1.45;font-weight:700}.report-card[data-group="observasi"] .report-icon{background:#fff2c7}.report-card[data-group="operasional"] .report-icon{background:#e9fbf4}.report-card[data-group="akademik"] .report-icon{background:#f0ecff}.report-card[data-group="pembinaan"] .report-icon{background:#fff0f3}.preview-shell{margin-top:16px;display:none}.preview-shell.show{display:block}.preview-actions{display:flex;gap:8px;justify-content:flex-end;margin-bottom:9px}.report-paper{background:#fff;border:1px solid #dfe6ef;border-radius:18px;padding:28px 30px;box-shadow:0 14px 40px rgba(37,58,88,.07)}.paper-head{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start;border-bottom:3px solid #1557d5;padding-bottom:15px;margin-bottom:15px}.brand small{display:block;color:#1557d5;font-size:.68rem;font-weight:1000;letter-spacing:.1em}.brand h2{margin:4px 0 2px;font-size:1.35rem;letter-spacing:-.03em}.brand p{margin:0;color:#68778d;font-size:.65rem;font-weight:700}.paper-meta{text-align:right;font-size:.61rem;color:#68778d;font-weight:800}.paper-meta b{color:#243149}.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.summary-box{border:1px solid #e2e8f0;border-radius:12px;padding:10px 11px;background:#fbfcfe}.summary-box span{display:block;color:#7a8799;font-size:.52rem;font-weight:850}.summary-box b{display:block;margin-top:3px;font-size:.82rem}.table-wrap{overflow:auto;border:1px solid #e3e8ef;border-radius:13px}.report-table{width:100%;border-collapse:collapse;min-width:760px}.report-table th{background:#f1f6ff;color:#35527d;text-align:left;font-size:.54rem;text-transform:uppercase <script>

const REPORTS=[

{id:'jurnal-kesehatan',group:'jurnal',icon:'🩺',title:'Jurnal Kesehatan',desc:'Kinerja harian petugas kesehatan.',path:'cahaya_app/jurnal_kesehatan',dateKey:'tanggal'},
{id:'jurnal-kk',group:'jurnal',icon:'🛡',title:'Jurnal Kebersihan & Keamanan',desc:'Pelaksanaan tugas kebersihan dan patroli.',path:'cahaya_app/jurnal_keamanan_kebersihan',dateKey:'tanggal'},

{id:'obs-pembelajaran',group:'observasi',icon:'📚',title:'Observasi Pembelajaran',desc:'Mutu proses pembelajaran.',path:'observasi_lapangan',dateKey:'tanggal',filter:x=>x.jenis==='pembelajaran'},
{id:'obs-sarpras',group:'observasi',icon:'🏗',title:'Observasi Sarpras',desc:'Mutu sarana prasarana.',path:'observasi_lapangan',dateKey:'tanggal',filter:x=>x.jenis==='sarpras'},
{id:'obs-kebersihan',group:'observasi',icon:'✨',title:'Observasi Kebersihan',desc:'Mutu kebersihan dan keamanan area.',path:'observasi_lapangan',dateKey:'tanggal',filter:x=>x.jenis==='kebersihan'},
{id:'obs-dapur',group:'observasi',icon:'🍽',title:'Observasi Dapur',desc:'Mutu layanan dapur.',path:'observasi_lapangan',dateKey:'tanggal',filter:x=>x.jenis==='dapur'},

{id:'abs-program',group:'akademik',icon:'◎',title:'Absensi Program Harian',desc:'Kehadiran santri pada program asrama.',path:'cahaya_app/absensi_program_harian',dateKey:'tanggal'},
{id:'abs-kbm',group:'akademik',icon:'▦',title:'Absensi Pembelajaran',desc:'Kehadiran santri dan catatan KBM.',path:'cahaya_app/absensi_pembelajaran',dateKey:'tanggal'},
{id:'abs-guru',group:'akademik',icon:'👤',title:'Absensi Guru',desc:'Kehadiran dan ketepatan waktu guru.',path:'cahaya_app/log_absensi_guru',dateKey:'tanggal'},
{id:'ujian',group:'akademik',icon:'✎',title:'Nilai Ujian Bulanan',desc:'Rekap nilai ujian bulanan.',path:'cahaya_app/nilai_ujian_bulanan',dateKey:'tanggal'},
{id:'tahfiz',group:'akademik',icon:'☾',title:'Setoran Tahfiz',desc:'Riwayat setoran dan baris hafalan.',path:'cahaya_app/setoran_tahfiz',dateKey:'tanggal'},

{id:'penindakan',group:'pembinaan',icon:'⚖',title:'Laporan Penindakan',desc:'Tindak lanjut kasus oleh Konselor.',path:'cahaya_app/laporan_penindakan',dateKey:'tanggalPenindakan',fallbackDate:'tanggalKejadian'},

{id:'asesmen-santri',group:'pembinaan',icon:'◇',title:'Asesmen CAHAYA Santri',desc:'Catatan asesmen perkembangan santri.',path:'cahaya_app/asesmen_cahaya_santri',dateKey:'tanggal'},
{id:'eval-pengasuhan',group:'evaluasi',icon:'↗',title:'Evaluasi Pengasuhan',desc:'Rapat dan tindak lanjut Pembinaan Karakter.',path:'cahaya_app/evaluasi_tindak_lanjut/pembinaan_karakter',dateKey:'tanggal'},
{id:'eval-pendidikan',group:'evaluasi',icon:'🎓',title:'Evaluasi Pendidikan',desc:'Rapat dan tindak lanjut Divisi Pendidikan.',path:'cahaya_app/evaluasi_tindak_lanjut/pendidikan',dateKey:'tanggal'}
];
let group='jurnal',selected=null,rows=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function localDate(d=new Date()){const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}function setMonth(){const n=new Date(),f=new Date(n.getFullYear(),n.getMonth(),1);$('from').value=localDate(f);$('to').value=localDate(n);if(selected)loadReport(selected)}
function vals(v){return Array.isArray(v)?v.filter(Boolean):Object.entries(v||{}).map(([id,x])=>x&&typeof x==='object'?{id,...x}:{id,value:x})}function first(o,paths,f=''){for(const p of paths){let v=o;for(const k of p.split('.'))v=v?.[k];if(v!==undefined&&v!==null&&v!=='')return v}return f}function flatCount(v){return Array.isArray(v)?v.filter(Boolean).length:Object.keys(v||{}).length}function dateOf(r,def){return String(r[def.dateKey]||r[def.fallbackDate]||r.tanggal||r.date||r.createdAt||r.dibuatPada||'').slice(0,10)}
function statusClass(s){const n=String(s||'').toLowerCase();return n.includes('kritis')||n.includes('sp 2')||n.includes('rusak berat')?'bad':n.includes('perlu')||n.includes('proses')||n.includes('terlambat')||n.includes('sp 1')?'warn':''}
function summary(r,def){const date=dateOf(r,def)||'-';let title='',detail='',status='';switch(def.id){case'jurnal-piket':title=first(r,['namaPersonil','namaPengawas','petugas'],'Jurnal Piket');detail=`${first(r,['blok','shift','unit'],'')} ${first(r,['catatan','ringkasan'],'')}`;status=first(r,['status','persentaseKinerja'],'');break;case'jurnal-sarpras':title=first(r,['namaPersonil','petugas'],'Petugas Sarpras');detail=first(r,['wilayahTugas','areaTugas','catatan'],'');status=first(r,['persentaseKinerja','persentase'],'');if(status!==''&&!String(status).includes('%'))status=`${status}%`;break;case'jurnal-kesehatan':title=first(r,['namaPersonil','petugas'],'Petugas Kesehatan');detail=first(r,['ringkasan','catatan'],'');status=first(r,['persentaseKinerja','persentase'],'');if(status!==''&&!String(status).includes('%'))status=`${status}%`;break;case'jurnal-kk':title=first(r,['namaPersonil','petugas'],'Petugas');detail=first(r,['wilayahTugas','areaTugas','catatan'],'');status=first(r,['persentaseKinerja','persentase'],'');if(status!==''&&!String(status).includes('%'))status=`${status}%`;break;default:if(def.group==='observasi'){title=first(r,['program','lokasi','dataUtama.program','dataUtama.area','dataUtama.kelas'],def.title);detail=`${first(r,['observer.nama'],'Observer')} • ${first(r,['temuanPerbaikan','temuanPositif'],'')}`;status=first(r,['status','mutuProgram.kategori'],'');break}if(def.id==='check-sarpras'){title=first(r,['wilayah','lokasi'],'Checklist Sarpras');detail=`${flatCount(r.detailPengecekan)} item • ${first(r,['namaPetugas'],'')}`;status=first(r,['status'],'');break}if(def.id==='tindak-sarpras'){title=first(r,['namaObjek'],'Temuan Sarpras');detail=`${first(r,['wilayah'],'')} • ${first(r,['tindakan','temuan'],'')}`;status=first(r,['status'],'');break}if(def.id==='pemeriksaan'){title=first(r,['identitasSantri.namaSantri','namaSantri'],'Santri');detail=first(r,['keluhanUtama','diagnosa','hasilPemeriksaan','disposisi.keputusan'],'Pemeriksaan');status=first(r,['disposisi.keputusan','statusPembelajaran'],'');break}if(def.id==='stok-obat'){title=first(r,['namaObat'],'Obat');detail=`Stok ${first(r,['stokSaatIni'],0)} • Minimum ${first(r,['stokMinimum'],0)} • Kedaluwarsa ${first(r,['tanggalKedaluwarsa'],'-')}`;status=Number(first(r,['stokSaatIni'],0))<=Number(first(r,['stokMinimum'],0))?'Stok Rendah':'Aman';break}if(def.id==='perizinan'){title=first(r,['namaSantri','santri.nama'],'Santri');detail=first(r,['alasan','keperluan','keterangan'],'');status=first(r,['status'],'');break}if(def.id==='abs-program'||def.id==='abs-kbm'){title=first(r,['program','namaProgram','mataPelajaran','mapel'],def.id==='abs-program'?'Program':'Pembelajaran');detail=`${first(r,['kelas','kelompok','usrah'],'')} • ${flatCount(r.data)} santri`;status=first(r,['status'],'Tercatat');break}if(def.id==='abs-guru'){title=first(r,['namaGuru','guruNama','guruKodeKalender'],'Guru');detail=`${first(r,['mapel'],'')} • ${first(r,['kelas'],'')} • ${first(r,['jadwalMulai'],'')}`;status=first(r,['statusKehadiran'],'Hadir');break}if(def.id==='ujian'){title=first(r,['nama_santri','namaSantri','nama'],'Santri');detail=`${first(r,['mata_pelajaran','mapel'],'')} • ${first(r,['kelas'],'')}`;status=`Nilai ${first(r,['nilai_total','nilai','nilaiAkhir'],'-')}`;break}if(def.id==='tahfiz'){title=first(r,['namaSantri','santri','nama_santri'],'Santri');detail=`${first(r,['surah','namaSurat','setoran'],'')} • ${first(r,['baris','jumlahBaris'],0)} baris`;status=first(r,['nilai','status'],'Setoran');break}if(def.id==='pelanggaran'){title=first(r,['dilaporkan','santri','namaSantri'],'Santri');detail=first(r,['kategoriPelanggaran','kategori','deskripsi','keterangan'],'Pelanggaran');status=first(r,['status'],'Dilaporkan');break}if(def.id==='penindakan'){title=first(r,['namaSantri','santri'],'Kasus');detail=first(r,['hasilTabayyun','tindakan','catatan'],'');status=first(r,['status','hasil'],'Ditindaklanjuti');break}if(def.id==='sp'){title=first(r,['namaSantri'],'Santri');detail=first(r,['deskripsiPelanggaran'],'');status=`SP ${first(r,['jenisSP'],'-')}`;break}if(def.id==='asesmen-santri'){title=first(r,['namaSantri','santri'],'Santri');detail=first(r,['narasi','catatan'],'Asesmen CAHAYA');status=first(r,['status','kategori'],'Tercatat');break}if(def.group==='evaluasi'){title=first(r,['judulRapat','judul','agenda'],'Rapat Evaluasi');detail=first(r,['ringkasan','hasilEvaluasi','temuanUtama'],'');status=`${flatCount(r.tindakLanjut)} tindak lanjut`;break}title=title||def.title;detail=detail||'';status=status||''}return{date,title,detail,status}}
function renderGroups(){$('groups').innerHTML=Object.entries(GROUPS).map(([k,v])=>`<button class="group-btn ${k===group?'active':''}" onclick="pickGroup('${k}')">${v}</button>`).join('')}function renderCatalog(){$('catalog').innerHTML=REPORTS.filter(r=>r.group===group).map(r=>`<button class="report-card ${selected?.id===r.id?'active':''}" data-group="${r.group}" onclick="loadReport('${r.id}')"><span class="report-icon">${r.icon}</span><strong>${esc(r.title)}</strong><span>${esc(r.desc)}</span></button>`).join('')}window.pickGroup=g=>{group=g;renderGroups();renderCatalog()};
async function fetchRows(def){let ref=db.ref(def.path),snap;const from=$('from').value,to=$('to').value;if(def.dateKey&&from&&to){try{snap=await ref.orderByChild(def.dateKey).startAt(from).endAt(to+'\uf8ff').once('value')}catch{snap=await ref.once('value')}}else snap=await ref.once('value');let arr=vals(snap.val()||{});if(def.filter)arr=arr.filter(def.filter);if(def.dateKey&&from&&to)arr=arr.filter(x=>{const d=dateOf(x,def);return !d||(d>=from&&d<=to)});return arr}
window.loadReport=async id=>{const def=REPORTS.find(r=>r.id===id);if(!def)return;selected=def;renderCatalog();$('loading').classList.add('show');try{rows=await fetchRows(def);rows.sort((a,b)=>String(dateOf(b,def)).localeCompare(String(dateOf(a,def))));renderPaper(def,rows);$('previewShell').classList.add('show');$('previewShell').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){console.error(e);$('reportPaper').innerHTML=`<div class="empty">Laporan belum dapat dimuat.<br>${esc(e.message)}</div>`;$('previewShell').classList.add('show')}finally{$('loading').classList.remove('show')}};window.reloadSelected=()=>selected&&loadReport(selected.id);
function renderPaper(def,data){const user=(()=>{try{return JSON.parse(localStorage.getItem('cahayaCurrentUser')||'{}')}catch{return{}}})(),generated=new Date().toLocaleString('id-ID',{dateStyle:'long',timeStyle:'short'}),summ=data.map(r=>summary(r,def));$('reportPaper').innerHTML=`<div class="paper-head"><div class="brand"><small>CAHAYA APP • PESANTREN CAHAYA FAJRUL ISLAM</small><h2>${esc(def.title)}</h2><p>Periode ${esc($('from').value||'Semua')} s.d. ${esc($('to').value||'Semua')}</p></div><div class="paper-meta"><b>Dicetak:</b> ${esc(generated)}<br><b>Oleh:</b> ${esc(user.label||user.nama||user.username||'Pengguna CAHAYA APP')}</div></div><div class="summary-row"><div class="summary-box"><span>Total Data</span><b>${data.length}</b></div><div class="summary-box"><span>Sumber</span><b>${esc(def.path)}</b></div><div class="summary-box"><span>Jenis Laporan</span><b>${esc(GROUPS[def.group])}</b></div></div>${summ.length?`<div class="table-wrap"><table class="report-table"><thead><tr><th style="width:38px">No</th><th style="width:105px">Tanggal</th><th style="width:190px">Data Utama</th><th>Keterangan</th><th style="width:130px">Status / Nilai</th></tr></thead><tbody>${summ.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.date)}</td><td><b>${esc(x.title)}</b></td><td>${esc(x.detail)}</td><td><span class="status ${statusClass(x.status)}">${esc(x.status||'-')}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada data pada periode ini.</div>'}<div class="footnote">Laporan dihasilkan langsung dari data CAHAYA APP pada saat dicetak.</div>`}
window.downloadPDF=async()=>{if(!selected)return;const target=$('reportPaper'),btns=document.querySelectorAll('.preview-actions button');btns.forEach(b=>b.disabled=true);$('loading').classList.add('show');try{const canvas=await html2canvas(target,{scale:1.7,useCORS:true,backgroundColor:'#ffffff'}),img=canvas.toDataURL('image/jpeg',.92),{jsPDF}=window.jspdf,pdf=new jsPDF('l','mm','a4'),pw=pdf.internal.pageSize.getWidth()-16,ph=pdf.internal.pageSize.getHeight()-16,ih=canvas.height*pw/canvas.width;let y=8,left=ih;pdf.addImage(img,'JPEG',8,y,pw,ih);left-=ph;while(left>0){pdf.addPage();y=8-(ih-left);pdf.addImage(img,'JPEG',8,y,pw,ih);left-=ph}pdf.save(`${selected.title.replace(/[^a-z0-9]+/gi,'-')}-${$('from').value||'semua'}-${$('to').value||'semua'}.pdf`)}catch(e){alert('PDF belum dapat dibuat: '+e.message)}finally{$('loading').classList.remove('show');btns.forEach(b=>b.disabled=false)}};
setMonth();renderGroups();renderCatalog();
</script>
