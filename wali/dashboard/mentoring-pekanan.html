<style>
:root{--wm-navy:#0b315f;--wm-blue:#146fe8;--wm-sky:#eef7ff;--wm-gold:#d9a52d;--wm-ink:#132d50;--wm-muted:#637b99;--wm-line:#d7e5f4}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#edf6ff 0,#f8fbff 420px);color:var(--wm-ink)}
.wm-report{max-width:980px;margin:auto;padding:14px 18px 48px}.wm-report-state{margin:0 0 14px;border-radius:16px}.wm-report-list{display:grid;gap:13px}
.wm-document{overflow:hidden;overflow-wrap:anywhere;padding:0!important;border:1px solid #cbdced!important;border-radius:22px!important;background:#fff!important;box-shadow:0 12px 34px rgba(20,62,105,.09)!important}.wm-document p{white-space:pre-line}.wm-card-summary{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:14px;min-height:92px;padding:17px 58px 17px 18px;list-style:none;cursor:pointer}.wm-card-summary::-webkit-details-marker{display:none}.wm-card-summary:after{content:"⌄";position:absolute;right:18px;top:50%;translate:0 -50%;display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:#edf6ff;color:var(--wm-blue);font-size:21px;font-weight:900;transition:transform .2s ease}.wm-document[open]>.wm-card-summary:after{transform:rotate(180deg)}.wm-summary-date{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:linear-gradient(145deg,#0d6ce6,#199dd2);color:#fff;box-shadow:0 9px 20px rgba(20,111,232,.2)}.wm-summary-date strong{font-size:21px;line-height:1}.wm-summary-date span{margin-top:3px;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.wm-summary-main{min-width:0}.wm-summary-main small{display:block;margin-bottom:5px;color:var(--wm-blue);font-size:10px;font-weight:900;line-height:1.45;letter-spacing:.08em;text-transform:uppercase}.wm-summary-main strong{display:block;overflow:hidden;color:var(--wm-ink);font-size:16px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}.wm-document[open]>.wm-card-summary{border-bottom:1px solid var(--wm-line);background:#f8fbff}
.wm-document-body{padding:26px}.wm-identity{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-bottom:26px;border:1px solid var(--wm-line);border-radius:18px;background:#f8fbff;overflow:hidden}.wm-identity-item{min-width:0;padding:15px 16px;border-right:1px solid var(--wm-line)}.wm-identity-item:last-child{border-right:0}.wm-identity-item span{display:block;margin-bottom:5px;color:#6a819c;font-size:10px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.wm-identity-item strong{display:block;font-size:14px;line-height:1.4}.wm-section{margin-top:28px}.wm-section-title{display:flex;align-items:center;gap:11px;margin:0 0 15px;font-size:19px}.wm-section-number{display:grid;place-items:center;width:34px;height:34px;flex:0 0 34px;border-radius:11px;background:var(--wm-navy);color:#fff;font-size:11px;letter-spacing:.05em}.wm-section-subtitle{margin:-8px 0 15px;color:var(--wm-muted);font-size:13px;line-height:1.55}
.wm-reflection{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wm-reflection section{position:relative;min-height:118px;padding:17px;border:1px solid #dce9f6;border-radius:17px;background:linear-gradient(145deg,#f8fbff,#f0f7ff)}.wm-reflection section:before{content:"";position:absolute;top:17px;right:17px;width:7px;height:7px;border-radius:50%;background:var(--wm-gold)}.wm-reflection h3{max-width:85%;margin:0 0 9px;color:#2c5d91;font-size:11px;line-height:1.45;letter-spacing:.07em;text-transform:uppercase}.wm-reflection p{margin:0;font-size:14px;line-height:1.65}
.wm-reflection-single{grid-template-columns:1fr}.wm-reflection-single section{min-height:0}.wm-target-details{display:grid;gap:10px;margin-bottom:13px}.wm-target-item{position:relative;padding:15px 17px;border:1px solid #d8e7f5;border-radius:15px;background:#f8fbff}.wm-target-item:before{content:"";position:absolute;top:17px;right:17px;width:7px;height:7px;border-radius:50%;background:var(--wm-gold)}.wm-target-item strong{display:block;padding-right:20px;color:#2c5d91;font-size:10px;line-height:1.45;letter-spacing:.08em;text-transform:uppercase}.wm-target-item p{margin:7px 0 0;color:var(--wm-ink);font-size:14px;line-height:1.6}
.wm-dimensions{display:grid;gap:9px}.wm-dimension{margin:0;border:1px solid var(--wm-line);border-radius:15px;background:#fff;overflow:hidden}.wm-dimension[open]{border-color:#acd1f5;box-shadow:0 9px 24px rgba(35,104,170,.08)}.wm-dimension summary{position:relative;min-height:54px;padding:16px 46px 16px 17px;list-style:none;font-weight:800;cursor:pointer}.wm-dimension summary::-webkit-details-marker{display:none}.wm-dimension summary:after{content:"+";position:absolute;right:16px;top:50%;translate:0 -50%;display:grid;place-items:center;width:25px;height:25px;border-radius:8px;background:#edf6ff;color:var(--wm-blue);font-size:18px}.wm-dimension[open] summary:after{content:"−"}.wm-dimension ul{margin:0;padding:2px 20px 12px 39px;border-top:1px solid #edf2f8}.wm-dimension li{margin:14px 0;padding-left:2px}.wm-dimension li::marker{color:var(--wm-blue)}.wm-dimension li p{margin:5px 0;color:#526b87;line-height:1.55}.wm-dimension-note{margin:0 17px 16px;padding:12px 14px;border-radius:12px;background:#fff8e7;color:#755716;line-height:1.55}
.wm-result{margin-top:12px;padding:20px;border:1px solid #a9d0f6;border-radius:20px;background:linear-gradient(135deg,#edf7ff,#f8fcff)}.wm-result-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start}.wm-result-target strong{display:block;color:var(--wm-blue);font-size:10px;text-transform:uppercase;letter-spacing:.1em}.wm-result-target p,.wm-result-note{margin:7px 0 0;line-height:1.65}.wm-result-status{text-align:right}.wm-result-status small{display:block;margin-top:8px;color:var(--wm-muted);font-size:11px}.wm-document-note{display:flex;align-items:flex-start;gap:12px;margin-top:28px;padding:16px 17px;border-top:1px solid var(--wm-line);border-radius:15px;background:#f7f9fc;color:#52677f;font-size:12px;line-height:1.6}.wm-document-note:before{content:"i";display:grid;place-items:center;width:24px;height:24px;flex:0 0 24px;border-radius:50%;background:#dcecff;color:var(--wm-blue);font-weight:900}.wm-document-note strong{color:var(--wm-ink)}
@media(max-width:700px){.wm-report{padding:10px 12px 34px}.wm-document{border-radius:19px!important}.wm-card-summary{grid-template-columns:auto minmax(0,1fr);gap:11px;min-height:82px;padding:14px 50px 14px 14px}.wm-summary-date{width:49px;height:49px;border-radius:14px}.wm-document-body{padding:18px}.wm-reflection{grid-template-columns:1fr}.wm-reflection section{min-height:0}.wm-result-grid{grid-template-columns:1fr}.wm-result-status{text-align:left}.wm-section-title{font-size:17px}}
@media(max-width:390px){.wm-summary-main strong{font-size:14px}.wm-identity{grid-template-columns:1fr}.wm-identity-item{border-right:0;border-bottom:1px solid var(--wm-line)}.wm-identity-item:last-child{border-bottom:0}.wm-document-body{padding:15px}}
@media print{body{background:#fff}.wm-report-state,.wm-card-summary{display:none!important}.wm-report{max-width:none;padding:0}.wm-report-list{margin:0}.wm-document{break-after:page;border:0!important;border-radius:0!important;box-shadow:none!important}.wm-document>.wm-document-body{display:block!important}.wm-dimension:not([open])>*:not(summary){display:block}.wm-dimension summary:after{display:none}}
</style>
