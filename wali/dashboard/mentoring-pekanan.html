<main class="wm-report ui-page">
  <header class="ui-hero wm-page-hero"><span class="ui-eyebrow">HASIL OBSERVASI TIM MENTOR</span><h1>Laporan Perkembangan Pekanan</h1><p>Dokumen perkembangan yang merangkum hasil observasi Tim Mentor, target pertumbuhan ananda, dan tindak lanjut pendampingan.</p><p id="mentoringChild" class="wm-child-chip">Menyiapkan laporan ananda…</p></header>
  <section class="wm-filter-panel" aria-labelledby="mentoringFilterTitle">
    <div class="wm-filter-heading"><span>PERIODE LAPORAN</span><strong id="mentoringFilterTitle">Pilih rentang mentoring</strong></div>
    <form id="mentoringFilter" class="wm-report-filters">
      <label>Tanggal mulai<input id="mentoringStart" type="date" required></label>
      <label>Tanggal akhir<input id="mentoringEnd" type="date" required></label>
      <div class="wm-report-actions"><button type="button" class="ui-button" data-period="week">Pekan Ini</button><button type="button" class="ui-button" data-period="month">Bulan Ini</button><button type="button" class="ui-button" data-period="history">90 Hari</button><button type="submit" class="ui-button primary" id="mentoringApply">Lihat Laporan</button></div>
    </form>
  </section>
  <div id="mentoringState" class="ui-state wm-report-state" role="status" aria-live="polite">Memuat laporan mentoring…</div>
  <div id="mentoringReports" class="wm-report-list" aria-label="Riwayat mentoring ananda"></div>
</main>
