<!doctype html>
<html lang="id" data-unit="putra">
<head>
<base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#082c30"><meta name="robots" content="noindex,noarchive">
<title>CAHAYA Live Putra · Pesantren Cahaya Fajrul Islam</title>
<link rel="icon" href="../assets/cahaya-app/favicon.ico">
<link rel="stylesheet" href="tv.css?v=prayer-audio1">
</head>
<body>
<div class="landscape" aria-hidden="true"></div><div class="light" aria-hidden="true"></div>
<main>
<header>
  <div class="brand"><img src="../assets/cahaya-app/app-icon-v67-192.png" alt=""><div><b>CAHAYA <i>Live</i></b><small>Unit Putra · Pesantren Cahaya Fajrul Islam</small></div></div>

</footer>
</main>
