</style><link rel="stylesheet" href="../css/pendidikan-ui-v191.css?v=191"></head><body class="education-final-ui"><main class="app"><section class="hero"><button class="back" onclick="goHome()">←</button><div><h1>Manajemen Kelas</h1><p>Naikkan kelas akademik dan pindahkan program Al-Qur’an santri secara massal.</p></div></section><section class="panel"><div class="filters"><div class="field"><label>Kelas asal</label><select class="control" id="source"></select></div><div class="field"><label>Cari santri</label><input class="control" id="search" placeholder="Ketik nama santri..."></div><div class="field"><label>Pindahkan ke kelas</label><select class="control" id="destination"></select></div><div class="field"><label>Program Al-Qur’an baru</label><select class="control" id="quran"><option value="">Tidak diubah</option><option>Tahsin</option><option>Tahfiz</option><option>Murojaah</option></select></div></div><div class="toolbar"><button class="btn soft" id="selectAll">Pilih Semua</button><button class="btn primary" id="save">Simpan Perpindahan</button></div><div class="summary" id="summary">Memuat data...</div><div class="list" id="list"></div></section></main><div class="toast" id="toast"></div><script type="module">
import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';import{getDatabase,ref,get,set,update,push}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';const app=getApps().length?getApps()[0]:initializeApp(window.CAHAYA_CONFIG.firebase),db=getDatabase(app),$=id=>document.getElementById(id),USER=(()=>{try{return JSON.parse(localStorage.getItem('cahayaCurrentUser')||'{}')}catch{return{}}})(),P=window.parent&&window.parent!==window?window.parent:window;let classes={},programs={};const key=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,''),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function goHome(){try{P.openAuthorizedMenu?.('menu-home')}catch{history.back()}}window.goHome=goHome;function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function ordered(){return Object.keys(classes).sort((a,b)=>a.localeCompare(b,'id',{numeric:true}))}function fill(){const opts=ordered().map(x=>`<option>${esc(x)}</option>`).join('');$('source').innerHTML=opts;$('destination').innerHTML='<option value="">Pilih kelas tujuan</option>'+opts;render()}function rows(){const source=$('source').value,q=$('search').value.toLowerCase();return(classes[source]||[]).filter(n=>!q||String(n).toLowerCase().includes(q))}function render(){const list=rows();$('summary').textContent=`${list.length} santri • centang santri yang akan dipindahkan`;$('list').innerHTML=list.length?list.map(n=>{const p=programs[key(n)]?.programQuran||'Belum diatur';return`<label class="row"><input type="checkbox" data-name="${esc(n)}"><span><b>${esc(n)}</b><small>${esc($('source').value)} • Program ${esc(p)}</small></span><span class="tag">${esc(p)}</span></label>`}).join(''):'<div class="empty">Santri tidak ditemukan.</div>'}async function load(){const[s,p]=await Promise.all([get(ref(db,'cahaya_app/master_akademik/kelas')),get(ref(db,'cahaya_app/program_quran_santri'))]);classes=s.exists()?s.val():(window.CAHAYA_MASTER_DATA?.santriByClass||{});programs=p.val()||{};Object.keys(classes).forEach(k=>{if(!Array.isArray(classes[k]))classes[k]=Object.values(classes[k]||{})});fill()}$('source').onchange=render;$('search').oninput=render;$('selectAll').onclick=()=>document.querySelectorAll('[data-name]').forEach(x=>x.checked=true);$('save').onclick=async()=>{const names=[...document.querySelectorAll('[data-name]:checked')].map(x=>x.dataset.name),from=$('source').value,to=$('destination').value,program=$('quran').value;if(!names.length)return toast('Pilih minimal satu santri.');if(!to&&!program)return toast('Pilih kelas tujuan atau program Al-Qur’an.');if(to){Object.keys(classes).forEach(k=>classes[k]=(classes[k]||[]).filter(n=>!names.includes(n)));classes[to]=[...new Set([...(classes[to]||[]),...names])].sort((a,b)=>a.localeCompare(b,'id'))}const now=new Date().toISOString(),updates={};if(program)names.forEach(n=>updates[`cahaya_app/program_quran_santri/${key(n)}`]={namaSantri:n,programQuran:program,kelasAkademik:to||from,updatedAt:now,updatedBy:USER.label||USER.nama||USER.username||''});await set(ref(db,'cahaya_app/master_akademik/kelas'),classes);if(Object.keys(updates).length)await update(ref(db),updates);await push(ref(db,'cahaya_app/log_manajemen_kelas'),{santri:names,dariKelas:from,keKelas:to||from,programQuran:program||'Tidak diubah',jumlah:names.length,oleh:USER.label||USER.nama||USER.username||'',timestamp:now});toast(`${names.length} santri berhasil diperbarui.`);fill()};load().catch(e=>{console.error(e);$('summary').textContent='Data kelas gagal dimuat.'});
