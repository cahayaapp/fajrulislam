</style></head><body><main class="attendance-page" data-cahaya-component="guru-mukim-table"><section class="scene active" id="scenePrayer"><section class="page-hero"><span class="eyebrow">MANAJEMEN PENDIDIKAN</span><h1>Absensi Ibadah Guru Mukim</h1><p>Pilih waktu salat, lalu catat kehadiran Guru Mukim dengan alur yang sama seperti Presensi Santri.</p><div class="hero-meta"><span id="roleBadge">Memuat akses…</span><span id="unitBadge">Unit</span></div></section><div class="date-box"><label for="date">Tanggal Absensi</label><input id="date" type="date"></div><div class="program-grid" id="prayerGrid"></div><a class="settings-link" href="pengaturan-guru-mukim.html?v=267">⚙ Atur daftar Guru Mukim</a></section>

<script type="module">
import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';import{getDatabase,ref,get,update,query,orderByChild,equalTo}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
const cfg=window.CAHAYA_CONFIG?.firebase||{apiKey:'AIzaSyB0Eza852WuQL2R8U-yHpVnM3o8NMxZolI',authDomain:'absensi-santri-fajrul-islam.firebaseapp.com',databaseURL:'https://absensi-santri-fajrul-islam-default-rtdb.firebaseio.com',projectId:'absensi-santri-fajrul-islam',storageBucket:'absensi-santri-fajrul-islam.firebasestorage.app',messagingSenderId:'739982369926',appId:'1:739982369926:web:7e5375c3ddbaf0584cdd07'};const app=getApps().length?getApps()[0]:initializeApp(cfg),db=getDatabase(app),$=id=>document.getElementById(id),USER=(()=>{try{return JSON.parse(localStorage.getItem('cahayaCurrentUser')||'{}')}catch{return{}}})(),R=window.CahayaRoleSystemV2,SESSION=R?.resolveSession(USER,localStorage),A=SESSION?.activeAssignment||{},authorized=SESSION?.activeRole==='MANAJER'&&R?.isEducationManager(A)&&['PUTRA','PUTRI'].includes(A.unit),unit=A.unit==='PUTRI'?'Putri':'Putra';
const PRAYERS=[['subuh','Subuh','Awal hari'],['dzuhur','Dzuhur','Tengah hari'],['ashar','Ashar','Sore hari'],['maghrib','Maghrib','Selepas matahari terbenam'],['isya','Isya','Malam hari']],STATUSES=['Hadir','Tidak Hadir','Izin','Sakit','Tugas Lembaga','Belum Diisi'];let schedule=[],settings=[],attendance=[],activePrayer='',saving=false;const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim(),key=v=>norm(v).replace(/ /g,''),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rows=v=>Array.isArray(v)?v.filter(Boolean):Object.entries(v||{}).map(([id,x])=>({id,...(x||{})})),teacherCode=r=>String(r.guruKode||r.kodeGuru||r.teacherCode||r.guruKey||'').trim().toUpperCase(),teacherName=r=>String(r.namaGuru||r.guruNama||r.guru||r.guruTerjadwal||r.teacher||teacherCode(r)||'').trim(),unitOf=v=>norm(v).includes('putri')?'Putri':norm(v).includes('putra')?'Putra':'Semua',teacherKey=t=>key(t.code||t.name),localDate=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta'}).format(new Date());$('date').value=localDate();$('roleBadge').textContent=authorized?'Input • Manajer Pendidikan':'Akses terbatas';$('unitBadge').textContent=`${unit} • Kepondokan`;
function toast(message,error=false){$('toast').textContent=message;$('toast').classList.toggle('error',error);$('toast').classList.add('show');clearTimeout(window.__worshipToast);window.__worshipToast=setTimeout(()=>$('toast').classList.remove('show'),2500)}function inScope(r={}){const text=norm([r.jenis,r.programDomain,r.domain,r.unit,r.kelas,r.sumber,r.jadwalId].filter(Boolean).join(' '));return!/(^| )pkbm( |$)/.test(text)&&unitOf(r.unit||r.kelas||r.unitPembelajaran)===unit}function matches(r,t){const ids=[t.code,t.name].map(key).filter(Boolean);return[r.guruKode,r.guruKey,r.namaGuru].some(v=>ids.includes(key(v)))||ids.some(v=>String(r.id||'').endsWith('_'+v))}
function roster(){const map=new Map();rows(schedule).filter(inScope).forEach(r=>{const code=teacherCode(r),name=teacherName(r);if(code||name)map.set(key(code||name),{code:code||String(name).toUpperCase(),name:name||code,unit})});rows(settings).filter(inScope).forEach(r=>{if(r.mukim===false||r.aktif===false)return;const code=String(r.guruKode||r.guruKey||'').toUpperCase(),name=String(r.namaGuru||code),id=key(code||name);if(id&&!map.has(id))map.set(id,{code,name,unit:r.unit||unit})});return[...map.values()].filter(t=>{const s=rows(settings).find(r=>matches(r,t));return s&&s.mukim!==false&&s.aktif!==false}).sort((a,b)=>a.name.localeCompare(b.name,'id'))}function record(t){return rows(attendance).find(r=>r.tanggal===$('date').value&&matches(r,t))||{}}function scene(id){document.querySelectorAll('.scene').forEach(x=>x.classList.toggle('active',x.id===id));window.scrollTo({top:0,behavior:'smooth'})}function dateLabel(v){return new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Asia/Jakarta'}).format(new Date(`${v}T12:00:00+07:00`))}
function renderPrayer(){const list=roster();$('prayerGrid').innerHTML=PRAYERS.map(([id,label,hint])=>`<button class="program-card" data-prayer-card="${id}"><span class="prayer-icon">☾</span><b>${label}</b><small>${hint} • ${list.filter(t=>record(t)[id]&&record(t)[id]!=='Belum Diisi').length}/${list.length} tercatat</small></button>`).join('');document.querySelectorAll('[data-prayer-card]').forEach(b=>b.onclick=()=>openPrayer(b.dataset.prayerCard))}function choice(t,s,current){const id=`${activePrayer}_${teacherKey(t)}_${key(s)}`;return`<label class="status-choice" data-status="${esc(s)}"><input type="radio" name="${activePrayer}_${esc(teacherKey(t))}" id="${id}" value="${esc(s)}" ${s===(current||'Belum Diisi')?'checked':''} ${authorized?'':'disabled'}><span>${esc(s)}</span></label>`}
function renderAttendance(){const search=norm($('teacherSearch').value),all=roster(),visible=all.filter(t=>!search||norm(`${t.name} ${t.code}`).includes(search));$('teacherList').innerHTML=visible.length?visible.map((t,i)=>`<article class="student-card" data-teacher="${esc(t.code||t.name)}"><div class="student-head"><span class="student-number">${i+1}</span><div><div class="student-name">${esc(t.name)}</div><span class="teacher-meta">${esc(t.code||'Guru Mukim')} • ${unit}</span></div></div><div class="status-grid">${STATUSES.map(s=>choice(t,s,record(t)[activePrayer])).join('')}</div></article>`).join(''):'<div class="empty-state">Tidak ada Guru Mukim yang sesuai pencarian.<br><a class="settings-link" href="pengaturan-guru-mukim.html?v=267">Buka Pengaturan Guru Mukim</a></div>';document.querySelectorAll('#teacherList input').forEach(x=>x.onchange=summary);summary()}function selected(t){const card=[...document.querySelectorAll('[data-teacher]')].find(x=>key(x.dataset.teacher)===teacherKey(t));return card?.querySelector('input:checked')?.value||record(t)[activePrayer]||'Belum Diisi'}function summary(){const vals=roster().map(selected);$('sumTotal').textContent=vals.length;$('sumPresent').textContent=vals.filter(v=>v==='Hadir').length;$('sumAbsent').textContent=vals.filter(v=>v==='Tidak Hadir').length;$('sumExcused').textContent=vals.filter(v=>['Izin','Sakit','Tugas Lembaga'].includes(v)).length;$('sumEmpty').textContent=vals.filter(v=>!v||v==='Belum Diisi').length}function openPrayer(id){activePrayer=id;const label=PRAYERS.find(x=>x[0]===id)?.[1]||id;$('attendanceTitle').textContent=`Absensi ${label}`;$('attendanceSubtitle').textContent='Pilih status setiap Guru Mukim, kemudian simpan absensi.';$('contextPrayer').textContent=`Salat ${label}`;$('contextDate').textContent=dateLabel($('date').value);$('contextUnit').textContent=unit;$('teacherSearch').value='';renderAttendance();scene('sceneAttendance')}
async function read(path,q){const snap=await get(q||ref(db,path));return snap.val()||{}}async function load(){if(!authorized)return;try{const [sch,setg]=await Promise.all([read('cahaya_app/jadwal_pelajaran'),read('cahaya_app/pengaturan_guru_mukim')]);schedule=rows(sch);settings=rows(setg);let att={};try{att=await read('cahaya_app/absensi_ibadah_guru',query(ref(db,'cahaya_app/absensi_ibadah_guru'),orderByChild('tanggal'),equalTo($('date').value)))}catch{const found=await Promise.all(roster().map(async t=>{const id=`${$('date').value}_${teacherKey(t)}`;return[id,await read(`cahaya_app/absensi_ibadah_guru/${id}`)]}));att=Object.fromEntries(found.filter(([,v])=>Object.keys(v).length))}attendance=rows(att);renderPrayer();if(activePrayer)renderAttendance()}catch(error){console.error(error);toast('Data absensi belum dapat dimuat.',true)}}
$('date').onchange=()=>{activePrayer='';scene('scenePrayer');load()};$('backPrayer').onclick=()=>{activePrayer='';renderPrayer();scene('scenePrayer')};$('teacherSearch').oninput=renderAttendance;$('presentAll').onclick=()=>{if(!authorized)return;document.querySelectorAll('#teacherList input[value="Hadir"]').forEach(x=>x.checked=true);summary()};$('saveAttendance').onclick=async()=>{if(!authorized||saving||!activePrayer)return;saving=true;$('saveAttendance').disabled=true;$('saveAttendance').textContent='Menyimpan…';try{const updates={},now=new Date().toISOString();roster().forEach(t=>{const{id:_recordId,...old}=record(t),id=`${$('date').value}_${teacherKey(t)}`;updates[`cahaya_app/absensi_ibadah_guru/${id}`]={...old,tanggal:$('date').value,guruKey:teacherKey(t),guruKode:t.code||'',namaGuru:t.name,unit,programDomain:'KEPONDOKAN',[activePrayer]:selected(t),inputOleh:USER.label||USER.nama||USER.username||'',updatedAt:now}});if(!Object.keys(updates).length)throw new Error('Belum ada Guru Mukim aktif.');await update(ref(db),updates);toast('Absensi ibadah berhasil disimpan.');await load()}catch(error){console.error(error);toast(error.message||'Absensi ibadah gagal disimpan.',true)}finally{saving=false;$('saveAttendance').disabled=false;$('saveAttendance').textContent='Simpan Absensi Ibadah'}};if(authorized)load();else $('prayerGrid').innerHTML='<div class="empty-state">Akses hanya untuk Manajer Pendidikan sesuai unit penugasan.</div>';
</script></body></html>
