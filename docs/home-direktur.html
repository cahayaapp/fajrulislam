function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function vals(v){if(Array.isArray(v))return v.filter(Boolean);return Object.entries(v||{}).map(([id,x])=>({id,...(x||{})}))}

function month(){return today().slice(0,7)}
function n(v){const x=Number(v);return Number.isFinite(x)?x:0}
function norm(v){return String(v||'').trim().toLowerCase()}
function pkbmText(r={}){return norm([r.jenis,r.unit,r.unitPembelajaran,r.unitPendidikan,r.kelas,r.kelas_kelompok,r.rombel,r.namaRuang,r.sesi,r.sumber,r.sumberJadwal,r.program,r.jadwalId,r.id,r.kodeKelas,r.kategori,r.judul,r.masalah,r.isu].filter(Boolean).join(' ')).replace(/[^a-z0-9]+/g,' ').trim()}
function isPkbmRecord(r={}){return /(^| )pkbm( |$)/.test(pkbmText(r))}
function kepondokanRows(rows=[]){return (rows||[]).filter(r=>!isPkbmRecord(r))}
function nameKey(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function money(v){return new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(n(v))}
function compactMoney(v){const x=n(v);if(x>=1e9)return`Rp ${(x/1e9).toFixed(x>=10e9?0:1).replace('.',',')} M`;if(x>=1e6)return`Rp ${(x/1e6).toFixed(x>=10e6?0:1).replace('.',',')} jt`;if(x>=1e3)return`Rp ${(x/1e3).toFixed(0)} rb`;return`Rp ${money(x)}`}
function clockMinutes(v){const m=String(v||'').match(/(\d{1,2})[:.](\d{2})/);return m?Number(m[1])*60+Number(m[2]):NaN}
function jakartaContext(){const date=today();const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const obj=Object.fromEntries(parts.map(p=>[p.type,p.value]));const clock=`${obj.hour||'00'}:${obj.minute||'00'}`;return{date,clock,minutes:clockMinutes(clock),day:new Date(`${date}T12:00:00+07:00`).getDay()}}
function isoAdd(date,days){const d=new Date(`${date}T12:00:00+07:00`);d.setDate(d.getDate()+days);return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}

function computePeriodScores(programRows,learningRows,due,teacherRows,rawUsrah){

const HIJRI_MONTHS=['Muharam','Safar','Rabiul Awal','Rabiul Akhir','Jumadil Awal','Jumadil Akhir','Rajab','Syakban','Ramadan','Syawal','Zulkaidah','Zulhijah'];
function hijriCivil(date){const g=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(date).split('-').map(Number),Y=g[0],M=g[1],D=g[2],a=Math.floor((14-M)/12),y=Y+4800-a,m=M+12*a-3,jdn=D+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045,l0=jdn-1948440+10632,n0=Math.floor((l0-1)/10631);let l=l0-10631*n0+354,j=(Math.floor((10985-l)/5316))*Math.floor((50*l)/17719)+Math.floor(l/5670)*Math.floor((43*l)/15238);l=l-Math.floor((30-j)/15)*Math.floor((17719*j)/50)-Math.floor(j/16)*Math.floor((15238*j)/43)+29;const hm=Math.floor((24*l)/709),hd=l-Math.floor((709*hm)/24),hy=30*n0+j-30;return`${hd} ${HIJRI_MONTHS[hm-1]||''} ${hy} H`}
function hijriLabel(date){try{const f=new Intl.DateTimeFormat('en-US-u-ca-islamic',{timeZone:'Asia/Jakarta',day:'numeric',month:'numeric',year:'numeric'});if(String(f.resolvedOptions().calendar||'').startsWith('islamic')){const p={};f.formatToParts(date).forEach(x=>{if(x.type!=='literal')p[x.type]=x.value});const mm=Number(p.month),dd=Number(p.day),yy=Number(p.year);if(mm>=1&&mm<=12&&dd&&yy)return`${dd} ${HIJRI_MONTHS[mm-1]} ${yy} H`}}catch(e){}return hijriCivil(date)}
function initIdentity(){let u={};try{u=JSON.parse(localStorage.getItem('cahayaCurrentUser')||'{}')}catch{}const name=String(u.label||u.nama||u.username||'Pengguna').trim(),first=name.split(/\s+/)[0]||'P';$('greeting').textContent=`Assalamu’alaikum, ${name}`;if(u.fotoProfil){$('avatarBtn').innerHTML=`<img src="${esc(u.fotoProfil)}" alt="Profil">`}else $('avatarBtn').textContent=first.charAt(0).toUpperCase();const now=new Date();$('dateM').textContent=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);$('dateH').textContent=hijriLabel(now)}
initIdentity();renderDivisionMonitor();loadData().finally(()=>{try{if(sessionStorage.getItem('cahayaDirectorOpenNotif')==='1'){sessionStorage.removeItem('cahayaDirectorOpenNotif');setTimeout(()=>openAttentionModal(),180)}}catch(_){}});
</script>
