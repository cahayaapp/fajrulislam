<!doctype html><html lang="id"><head><script src="../config/tenant-config.js"></script><script src="../js/cahaya-workspace-core-v82.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mentoring Usrah • CAHAYA APP</title><link rel="stylesheet" href="../css/cahaya-workspace-v82.css"><style>.form{background:#fff;border:1px solid #e2eaf4;border-radius:20px;padding:15px;box-shadow:0 9px 28px rgba(35,78,160,.055)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.cw-field textarea{min-height:82px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}</style>
<link rel="stylesheet" href="../css/cahaya-premium-v85.css?v=85">
</head><body class="v84-purple">
<main class="cw-page"><section class="cw-hero"><div class="cw-hero-row"><div><div class="cw-eyebrow">CAHAYA APP • Pembinaan Karakter</div><h1>Mentoring Usrah</h1><p>Fokusnya bukan menjadikan mentoring individu versi kelompok, tetapi membangun identitas bersama: “Kita ingin menjadi usrah seperti apa?”</p></div><div class="cw-hero-badge">Pekanan</div></div></section>
<section class="cw-section"><div class="form"><div class="form-grid"><div class="cw-field"><label>Usrah</label><select id="usrah"></select></div><div class="cw-field"><label>Periode Pekan</label><input id="period" type="week"></div><div class="cw-field full"><label>Apa yang sudah baik?</label><textarea id="good" placeholder="Kekuatan kelompok pekan ini..."></textarea></div><div class="cw-field full"><label>Apa yang perlu diperbaiki?</label><textarea id="improve" placeholder="Masalah utama kelompok..."></textarea></div><div class="cw-field full"><label>Target Usrah Pekan Berikutnya</label><textarea id="target" placeholder="Contoh: seluruh anggota sudah di masjid sebelum iqamah."></textarea></div><div class="cw-field full"><label>Rencana Aksi Kelompok</label><textarea id="action" placeholder="Siapa membantu siapa, kebiasaan apa yang dilakukan..."></textarea></div><div class="cw-field"><label>Reward yang Dikejar</label><select id="reward"><option value="">Tidak ditentukan</option><option>Nonton Pekanan</option><option>Rihlah</option><option>Apresiasi Khusus</option><option>Lainnya</option></select></div><div class="cw-field"><label>Catatan</label><input id="note" placeholder="Opsional"></div></div><div class="actions"><button class="cw-btn primary" id="save">Simpan Mentoring Usrah</button></div></div></section>
<section class="cw-section"><div class="cw-section-head"><div><h2>Riwayat Usrah</h2></div></div><div class="cw-list" id="history"></div></section></main>
<script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';import{getDatabase,ref,get,push,set}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';const CW=window.CahayaWorkspace;window.CW=CW;const app=getApps().length?getApps()[0]:initializeApp(window.CAHAYA_CONFIG.firebase);const db=getDatabase(app);const $=id=>document.getElementById(id);let usrahRows=[],logs=[];const role=CW.activeRole();function membersOf(x){const m=x.anggota||[];return Array.isArray(m)?m.map(v=>typeof v==='string'?v:(v?.nama||v?.namaSantri||'')).filter(Boolean):[]}function mine(x){return membersOf(x).some(n=>CW.key(n)===CW.key(CW.name())||CW.key(n)===CW.key(CW.username()))}function weekValue(){const d=new Date(),onejan=new Date(d.getFullYear(),0,1),week=Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);return`${d.getFullYear()}-W${String(week).padStart(2,'0')}`}function renderOptions(){$('period').value=weekValue();let rows=usrahRows;if(role==='asisten-naqib'){const own=usrahRows.filter(mine);rows=own.length?own:[]} $('usrah').innerHTML=rows.map((x,i)=>`<option value="${i}">${CW.esc(x.namaUsrah||x.usrah||x.nama||x.id||'Usrah')}</option>`).join('')||'<option>Usrah</option>';renderHistory()}function renderHistory(){const name=$('usrah').selectedOptions[0]?.text||'';const ls=logs.filter(x=>!name||CW.norm(x.usrah||x.namaUsrah)===CW.norm(name)).sort((a,b)=>String(b.timestamp||b.tanggal||'').localeCompare(String(a.timestamp||a.tanggal||'')));$('history').innerHTML=ls.slice(0,8).map(x=>`<div class="cw-row"><div><b>${CW.esc(x.periodePekan||x.tanggal||'-')}</b><small>Target: ${CW.esc(x.targetKelompok||'-')} ${x.rewardTarget?'· Reward: '+CW.esc(x.rewardTarget):''}</small></div><span class="cw-badge ok">Tercatat</span></div>`).join('')||'<div class="cw-empty">Belum ada mentoring usrah yang tercatat.</div>'}$('usrah').onchange=renderHistory;$('save').onclick=async()=>{if(role!=='asisten-naqib')return alert('Mentoring Usrah diinput oleh Asisten Naqib/Ketua Usrah.');const usrah=$('usrah').selectedOptions[0]?.text||'',target=$('target').value.trim();if(!usrah)return alert('Usrah Anda belum terhubung ke User/anggota Master Usrah.');if(!target)return alert('Target usrah wajib diisi.');const r=push(ref(db,'cahaya_app/mentoring_usrah')),payload={id:r.key,tanggal:CW.localDate(),timestamp:new Date().toISOString(),periodePekan:$('period').value,usrah,pelaksana:CW.name(),asistenNaqib:CW.name(),yangSudahBaik:$('good').value.trim(),perluDiperbaiki:$('improve').value.trim(),targetKelompok:target,rencanaAksi:$('action').value.trim(),rewardTarget:$('reward').value,catatan:$('note').value.trim(),status:'AKTIF'};await set(r,payload);logs.unshift(payload);CW.toast('Mentoring usrah tersimpan.');['good','improve','target','action','note'].forEach(id=>$(id).value='');renderHistory()};async function all(p){const s=await get(ref(db,p));return CW.records(s.exists()?s.val():null)}async function load(){try{const[u,l]=await Promise.all([get(ref(db,'cahaya_app/master_usrah')),all('cahaya_app/mentoring_usrah')]);usrahRows=CW.usrahRecords(u.exists()?u.val():null);logs=l;renderOptions()}catch(e){console.error(e);renderOptions()}}load();</script></body></html>
