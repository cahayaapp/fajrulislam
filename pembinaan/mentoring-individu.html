<!doctype html><html lang="id"><head><script src="../config/tenant-config.js"></script><script src="../js/cahaya-workspace-core-v82.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mentoring Individu • CAHAYA APP</title><link rel="stylesheet" href="../css/cahaya-workspace-v82.css"><style>.form{background:#fff;border:1px solid #e2eaf4;border-radius:20px;padding:15px;box-shadow:0 9px 28px rgba(35,78,160,.055)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.cw-field textarea{min-height:84px;resize:vertical}.dims{display:flex;gap:6px;flex-wrap:wrap}.dim{position:relative}.dim input{position:absolute;opacity:0}.dim span{display:block;padding:7px 10px;border:1px solid #dfe7f2;border-radius:999px;background:#fff;color:#637793;font-size:.57rem;font-weight:900;cursor:pointer}.dim input:checked+span{background:#eaf3ff;border-color:#bcd8fb;color:#1557d5}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}</style>
<link rel="stylesheet" href="../css/cahaya-fresh-v84.css?v=84">
</head><body class="v84-cyan">
<main class="cw-page"><section class="cw-hero"><div class="cw-hero-row"><div><div class="cw-eyebrow">CAHAYA APP • Pembinaan Karakter</div><h1>Mentoring Individu</h1><p>Check-in → review target → baca 5 CAHAYA → gali WHY → pilih fokus → target pekan berikutnya. Form dibuat ringkas agar dialog tetap menjadi pusat mentoring.</p></div><div class="cw-hero-badge" id="mentorBadge">Naqib Pendamping</div></div></section>
<section class="cw-section"><div class="form"><div class="form-grid"><div class="cw-field"><label>Usrah</label><select id="usrah"></select></div><div class="cw-field"><label>Santri</label><select id="student"></select></div><div class="cw-field full"><label>Target Sebelumnya</label><input id="previous" readonly placeholder="Belum ada target sebelumnya"></div><div class="cw-field full"><label>1. Check-in</label><textarea id="checkin" placeholder="Bagaimana keadaan santri pekan ini?"></textarea></div><div class="cw-field full"><label>2. Review Target Sebelumnya</label><textarea id="review" placeholder="Apa yang sudah berjalan? Apa hambatannya?"></textarea></div><div class="cw-field full"><label>3. Fokus Dimensi CAHAYA</label><div class="dims"><label class="dim"><input type="radio" name="dim" value="Cinta Allah" checked><span>🌙 Cinta Allah</span></label><label class="dim"><input type="radio" name="dim" value="Akhlak Mulia"><span>🤝 Akhlak Mulia</span></label><label class="dim"><input type="radio" name="dim" value="Hati Bersih"><span>💛 Hati Bersih</span></label><label class="dim"><input type="radio" name="dim" value="Akal Cerdas"><span>🧠 Akal Cerdas</span></label><label class="dim"><input type="radio" name="dim" value="Fisik Berdaya"><span>💪 Fisik Berdaya</span></label></div></div><div class="cw-field full"><label>4. WHY Santri</label><textarea id="why" placeholder="Mengapa perubahan ini penting menurut santri sendiri?"></textarea></div><div class="cw-field full"><label>5. Target Pekan Berikutnya</label><textarea id="target" placeholder="Buat target sederhana, spesifik, dan dapat dikawal Asisten Naqib."></textarea></div><div class="cw-field full"><label>Catatan Pendamping</label><textarea id="note" placeholder="Opsional"></textarea></div></div><div class="actions"><button class="cw-btn soft" onclick="resetForm()">Reset</button><button class="cw-btn primary" id="save">Simpan Mentoring & Target</button></div></div></section>
<section class="cw-section"><div class="cw-section-head"><div><h2>Riwayat Terbaru</h2><p>Catatan mentoring terbaru untuk santri yang dipilih.</p></div></div><div class="cw-list" id="history"></div></section></main>
<script type="module">import{initializeApp,getApps}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';import{getDatabase,ref,get,push,set}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';const CW=window.CahayaWorkspace;window.CW=CW;const app=getApps().length?getApps()[0]:initializeApp(window.CAHAYA_CONFIG.firebase);const db=getDatabase(app);const $=id=>document.getElementById(id);const role=CW.activeRole();let usrahRows=[],students=[],logs=[];function membersOf(x){const m=x.anggota||x.santri||x.members||x.daftarSantri||[];if(Array.isArray(m))return m.map(v=>typeof v==='string'?v:(v.nama||v.namaSantri||'')).filter(Boolean);if(m&&typeof m==='object')return Object.values(m).map(v=>typeof v==='string'?v:(v?.nama||v?.namaSantri||'')).filter(Boolean);return[]}function groupUnit(x){const n=Number(String(x.namaUsrah||x.usrah||x.id||'').match(/\d+/)?.[0]||0);return n>=7?'Putri':'Putra'}function loadUsrahOptions(){const pu=CW.unitFromProfile();let arr=usrahRows.length?usrahRows:[{id:'Semua',namaUsrah:'Semua Santri'}];if(pu==='Putra'||pu==='Putri')arr=arr.filter(x=>groupUnit(x)===pu);$('usrah').innerHTML=arr.map((x,i)=>`<option value="${i}">${CW.esc(x.namaUsrah||x.usrah||x.nama||x.id||'Usrah')}</option>`).join('');refreshStudents()}function refreshStudents(){const u=usrahRows[Number($('usrah').value)]||null;let names=u?membersOf(u):students.map(x=>x.nama||x.namaSantri||x.name).filter(Boolean);if(!names.length)names=students.map(x=>x.nama||x.namaSantri||x.name).filter(Boolean);names=[...new Set(names)].sort((a,b)=>a.localeCompare(b,'id'));$('student').innerHTML=names.map(n=>`<option>${CW.esc(n)}</option>`).join('');refreshStudent()}function studentLogs(){const n=$('student').value;return logs.filter(x=>CW.key(x.namaSantri||x.santri)===CW.key(n)).sort((a,b)=>Date.parse(b.tanggal||b.timestamp||0)-Date.parse(a.tanggal||a.timestamp||0))}function refreshStudent(){const ls=studentLogs(),last=ls[0];$('previous').value=last?.targetBaru||last?.targetPekanBerikutnya||last?.target||'';$('history').innerHTML=ls.slice(0,5).map(x=>`<div class="cw-row"><div><b>${CW.esc(String(x.tanggal||x.timestamp||'').slice(0,10)||'-')}</b><small>${CW.esc(x.fokusDimensi||x.dimensi||'CAHAYA')} · Target: ${CW.esc(x.targetBaru||x.target||'-')}</small></div><span class="cw-badge ok">Mentoring</span></div>`).join('')||'<div class="cw-empty">Belum ada riwayat mentoring santri ini.</div>'}window.resetForm=()=>{['checkin','review','why','target','note'].forEach(id=>$(id).value='')};$('usrah').onchange=refreshStudents;$('student').onchange=refreshStudent;$('save').onclick=async()=>{if(role!=='naqib-pendamping')return alert('Mentoring Individu diinput oleh Naqib Pendamping.');const santri=$('student').value,target=$('target').value.trim(),why=$('why').value.trim();if(!santri||!target)return alert('Pilih santri dan isi target pekan berikutnya.');const now=new Date().toISOString(),tanggal=CW.localDate(),dim=document.querySelector('input[name="dim"]:checked')?.value||'Cinta Allah';const mentoringRef=push(ref(db,'cahaya_app/log_mentoring_naqib'));const targetRef=push(ref(db,'cahaya_app/target_pertumbuhan'));const payload={idMentoring:mentoringRef.key,tanggal,timestamp:now,namaSantri:santri,santri,usrah:$('usrah').selectedOptions[0]?.text||'',naqibPendamping:CW.name(),pelaksana:CW.name(),checkin:$('checkin').value.trim(),targetSebelumnya:$('previous').value.trim(),reviewTarget:$('review').value.trim(),fokusDimensi:dim,whySantri:why,targetBaru:target,catatan:$('note').value.trim(),periode:CW.monthKey(),sumber:'Mentoring Individu v82'};await set(mentoringRef,payload);await set(targetRef,{idTarget:targetRef.key,studentName:santri,namaSantri:santri,sourceType:'MENTORING',sourceId:mentoringRef.key,dimensi:dim,target,whySantri:why,tanggalMulai:tanggal,status:'AKTIF',pengawal:'Asisten Naqib Pendamping',naqibPendamping:CW.name(),timestamp:now});logs.unshift(payload);CW.toast('Mentoring dan target pertumbuhan tersimpan.');resetForm();refreshStudent()};async function all(p){const s=await get(ref(db,p));return CW.records(s.exists()?s.val():null)}if(role!=='naqib-pendamping'){$('save').disabled=true;$('save').textContent='Hanya Naqib Pendamping';}
async function load(){try{const[u,st,l]=await Promise.all([get(ref(db,'cahaya_app/master_usrah')),all('cahaya_app/data_santri'),all('cahaya_app/log_mentoring_naqib')]);usrahRows=CW.usrahRecords(u.exists()?u.val():null);students=st;logs=l;$('mentorBadge').textContent=CW.name();loadUsrahOptions()}catch(e){console.error(e);loadUsrahOptions()}}load();</script></body></html>
