<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="refresh" content="0; url=/">
  <title>CAHAYA APP</title>
  <script>
    (function(){
      var target = '/';
      if (location.pathname !== '/') {
        try { sessionStorage.setItem('cahaya404Path', location.pathname + location.search + location.hash); } catch(e) {}
      }
      location.replace(target);
    })();
  </script>
</head>
<body></body>
</html>
